<!doctype html>
<html lang="en" data-resolution="portrait"
  data-composition-variables='[{"id":"renderScale","type":"number","label":"3D render scale (0.5 = draft)","default":1}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Respawn</title>
    <script>
      // Hold the runtime until the 3D stage has built its world (fonts, textures, shader warm-up).
      (function () {
        let resolve;
        const p = new Promise((r) => (resolve = r));
        window.__counterReady = { promise: p, resolve };
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["counter-stage"] = p;
      })();
    </script>
    <script src="vendor/gsap-3.14.2/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
        font-display: block;
      }
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      :root {
        --ground: #050608;
        --ink: #ffffff;
        --shadow: rgba(14, 9, 6, 0.85);
        --font-display: "Poppins", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--font-display);
      }
      #stage-layer {
        position: absolute;
        inset: 0;
      }
      #stage {
        display: block;
        width: 1080px;
        height: 1920px;
      }
      #hud {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }
      /* captions: one word at a time, centred in the 9:16 safe zone (clear of top 250 / bottom 400 px) */
      #captions {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1110px;
        height: 160px;
        pointer-events: none;
      }
      #captions .w {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        font-weight: 800;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.01em;
        white-space: nowrap;
        opacity: 0;
        text-shadow:
          0 5px 0 rgba(14, 9, 6, 0.55),
          0 0 3px var(--shadow),
          0 0 22px rgba(14, 9, 6, 0.6);
        -webkit-text-stroke: 9px rgba(14, 9, 6, 0.92);
        paint-order: stroke fill;
      }
      #endcard {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 760px;
        height: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        text-align: center;
        color: var(--ink);
      }
      #endcard .big {
        font-weight: 800;
        font-size: 104px;
        line-height: 1.02;
        max-width: 900px;
        text-shadow:
          0 6px 0 rgba(14, 9, 6, 0.55),
          0 0 26px rgba(14, 9, 6, 0.7);
      }
      #endcard .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 520px;
        height: 118px;
        border-radius: 22px;
        background: #e8732a;
        box-shadow:
          0 10px 0 #9c4512,
          0 18px 40px rgba(0, 0, 0, 0.45);
        font-weight: 800;
        font-size: 60px;
        color: #fff;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="54" data-width="1080" data-height="1920">
      <div id="stage-layer" class="clip" data-start="0" data-duration="54" data-track-index="0" data-layout-allow-overflow>
        <canvas id="stage" width="1080" height="1920"></canvas>
        <canvas id="hud" width="1080" height="1920"></canvas>
      </div>

      <div id="captions" class="clip" data-start="0" data-duration="50.85" data-track-index="2"></div>

      <div id="endcard" class="clip" data-start="50.9" data-duration="3.1" data-track-index="3">
        <div class="big" id="end-big">Would you have stayed in the city?</div>
        <div class="btn" id="end-btn">FOLLOW</div>
      </div>

      <audio id="vo" src="audio/vo.wav" data-start="0" data-duration="53.88" data-track-index="10" data-volume="1"></audio>
      <audio id="music" src="audio/music.wav" data-start="0" data-duration="54" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx" src="audio/sfx.wav" data-start="0" data-duration="54" data-track-index="12" data-volume="0.7"></audio>
    </div>

    <script type="module">
      import { WORDS } from "./src/captions-data.js";
      const holder = document.getElementById("captions");
      const tl = gsap.timeline({ paused: true });
      WORDS.forEach((w, i) => {
        const el = document.createElement("div");
        el.className = "w";
        el.textContent = w.w;
        holder.appendChild(el);
        tl.set(el, { opacity: 1, scale: 0.84 }, w.s);
        tl.to(el, { scale: 1, duration: 0.09, ease: "power2.out" }, w.s);
        tl.set(el, { opacity: 0 }, Math.min(w.off, 50.84));
      });
      tl.fromTo("#end-big", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 50.95);
      tl.fromTo("#end-btn", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 51.2);
      tl.to("#end-btn", { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 52.7);
      window.__timelines["main"] = tl;
      if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
