<!doctype html>
<!-- Reel cover (1080x1920; the 1080x1350 middle is what the profile grid shows, so everything that matters sits in
     y 300-1600). Same look as the reel: Glacier, Unbounded + Satoshi, the example reel with its score, and Cree.
     The score is the reel's example (EXAMPLE tag). Output renders/cover.png (gitignored). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Unb; font-weight: 900; src: url("../assets/fonts/unbounded-latin-900-normal.woff2"); }
@font-face { font-family: Sat; font-weight: 500; src: url("../assets/fonts/fontshare/Satoshi-Medium.woff2"); }
@font-face { font-family: Sat; font-weight: 700; src: url("../assets/fonts/fontshare/Satoshi-Bold.woff2"); }
@font-face { font-family: Sat; font-weight: 900; src: url("../assets/fonts/fontshare/Satoshi-Black.woff2"); }
@font-face { font-family: Mono; font-weight: 700; src: url("../assets/fonts/JetBrainsMono-Bold.ttf"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; overflow: hidden; }
#r { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Sat; color: #10131c; background: linear-gradient(180deg, #f7f8fc, #eceff7); }
.gl { position: absolute; border-radius: 50%; filter: blur(120px); }
.grain { position: absolute; inset: 0; background: url(../assets/img/noise.png); opacity: .09; mix-blend-mode: multiply; }
.bar { position: absolute; left: 90px; right: 90px; top: 330px; display: flex; align-items: center; gap: 18px; }
.bar img { height: 50px; }
.bar span { font-family: Mono; font-size: 24px; letter-spacing: .2em; color: rgba(16,19,28,.7); }
.bar b { margin-left: auto; font-weight: 700; font-size: 34px; background: #fff; padding: 12px 24px; border-radius: 999px; border: 2px solid #e8307d; box-shadow: 0 12px 30px rgba(40,50,90,.14); }
.bar b i { font-style: normal; font-weight: 900; color: #e8307d; }
h1 { position: absolute; left: 88px; right: 70px; top: 440px; font-weight: 900; font-size: 112px; line-height: .98; letter-spacing: -.04em; }
h1 em { font-style: normal; color: #d22b22; }
.phone { position: absolute; left: 90px; top: 830px; width: 400px; height: 711px; border-radius: 54px; overflow: hidden; border: 10px solid #10131c;
  box-shadow: 40px 60px 100px rgba(40,50,90,.28); transform: perspective(1900px) rotateY(16deg) rotateX(4deg); }
.phone img { width: 100%; height: 100%; object-fit: cover; }
.ex { position: absolute; left: 22px; top: 22px; background: rgba(16,19,28,.72); color: #fff; font-family: Mono; font-size: 22px; letter-spacing: .18em; padding: 6px 12px; border-radius: 8px; }
.sc { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 30px 60px rgba(40,50,90,.18); }
.sc b { font-family: Unb; font-weight: 900; font-size: 110px; letter-spacing: -.06em; line-height: 1; }
.sc span { font-weight: 500; font-size: 32px; color: rgba(16,19,28,.6); margin-top: 6px; }
.arrow { position: absolute; left: 700px; top: 1150px; font-family: Unb; font-weight: 900; font-size: 70px; color: rgba(16,19,28,.35); }
.cree { position: absolute; right: 60px; top: 1290px; width: 280px; filter: drop-shadow(0 20px 30px rgba(40,50,90,.22)); }
</style></head><body><div id="r">
<i class="gl" style="left:560px;top:60px;width:860px;height:860px;background:rgba(170,195,255,.85)"></i>
<i class="gl" style="left:-160px;top:1260px;width:900px;height:900px;background:rgba(214,190,255,.8)"></i>
<i class="gl" style="left:380px;top:900px;width:560px;height:560px;background:rgba(200,230,255,.55)"></i>
<div class="bar"><img src="../assets/img/creedom_logo.png" alt=""><span>REEL ANALYZER</span><b>Comment <i>CHECK</i></b></div>
<h1>Score your reel <em>before you post it.</em></h1>
<div class="phone"><img src="../assets/img/demo_f01.jpg" alt=""><b class="ex">EXAMPLE</b></div>
<div class="sc" style="left:560px;top:850px;border:6px solid #d22b22"><b style="color:#10131c">2.9</b><span>out of 5</span></div>
<div class="sc" style="left:700px;top:1210px;width:260px;height:260px;border:6px solid #0f8f5c"><b style="font-size:96px;color:#0f8f5c">4.4</b><span>after the fix</span></div>
<img class="cree" src="../assets/img/poses/cheer.png" alt="">
<div class="grain"></div>
</div></body></html>
