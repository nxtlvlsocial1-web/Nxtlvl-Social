<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --lemon: #fff56c;
        --ink: #0a0a0a;
        --blue: #2d33ba;
        --pink: #fe4a97;
        --green: #00c38a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--lemon);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--lemon);
      }
      #captions {
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scenes (graphics track) -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="3.05" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="16.95" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s9" data-composition-id="s9" data-composition-src="compositions/s9.html" data-start="28.35" data-duration="2.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="sfx-k1" class="clip" src="assets/sfx/key-press.mp3" data-start="31.18" data-duration="0.43" data-track-index="14" data-volume="0.7"></audio>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });

  </body>
</html>
