<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --lemon: #fff56c;
        --ink: #0a0a0a;
        --blue: #2d33ba;
        --pink: #fe4a97;
        --green: #00c38a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ink);
      }
      /* One continuous stage: ambient light, a dot grid and a lit horizon */
      #bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }
      .bg-glow {
        position: absolute;
        left: -360px;
        top: -80px;
        width: 1800px;
        height: 1800px;
        border-radius: 50%;
        opacity: 0;
      }
      #bg-lemon { background: radial-gradient(circle, rgba(255, 245, 108, 0.30) 0%, rgba(255, 245, 108, 0.10) 32%, rgba(255, 245, 108, 0) 62%); }
      #bg-blue { background: radial-gradient(circle, rgba(76, 84, 255, 0.42) 0%, rgba(45, 51, 186, 0.16) 34%, rgba(45, 51, 186, 0) 64%); }
      #bg-pink { background: radial-gradient(circle, rgba(254, 74, 151, 0.36) 0%, rgba(254, 74, 151, 0.12) 34%, rgba(254, 74, 151, 0) 64%); }
      #bg-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.10) 2.4px, rgba(255, 255, 255, 0) 3px);
        background-size: 40px 40px;
        -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 42%, #000 20%, rgba(0, 0, 0, 0) 80%);
        mask-image: radial-gradient(ellipse 70% 55% at 50% 42%, #000 20%, rgba(0, 0, 0, 0) 80%);
      }
      #bg-arc {
        position: absolute;
        left: -760px;
        top: 1440px;
        width: 2600px;
        height: 2600px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 0%, #17171c 0%, #0b0b0d 40%, #0a0a0a 70%);
        border-top: 3px solid rgba(255, 245, 108, 0.55);
        box-shadow: 0 -30px 90px rgba(255, 245, 108, 0.16), inset 0 30px 60px rgba(255, 245, 108, 0.06);
      }
      #bg-vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      .scene { z-index: 2; }
      #captions { z-index: 50; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1080"
      data-height="1920"
    >
      <!-- Ambient stage (untimed, full bleed) -->
      <div id="bg" data-layout-ignore>
        <div class="bg-glow" id="bg-lemon"></div>
        <div class="bg-glow" id="bg-blue"></div>
        <div class="bg-glow" id="bg-pink"></div>
        <div id="bg-grid"></div>
        <div id="bg-arc"></div>
        <div id="bg-vig"></div>
      </div>

      <!-- Scenes (graphics track) -->
      <div id="s1" class="scene" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="3.05" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2" class="scene" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="3.05" data-duration="2.95" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3" class="scene" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="6" data-duration="3.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4" class="scene" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="9.7" data-duration="3.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5" class="scene" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="13.5" data-duration="3.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6" class="scene" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="16.95" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s7" class="scene" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="19.35" data-duration="3.55" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s8" class="scene" data-composition-id="s8" data-composition-src="compositions/s8.html" data-start="22.9" data-duration="5.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s9" class="scene" data-composition-id="s9" data-composition-src="compositions/s9.html" data-start="28.35" data-duration="2.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s10" class="scene" data-composition-id="s10" data-composition-src="compositions/s10.html" data-start="30.8" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Captions (one host holds every group) -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30.8" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Voiceover: DRAFT (Kokoro af_heart x1.12). Swap for the client's recording. -->
      <audio id="vo" class="clip" src="assets/voice/vo.wav" data-start="0" data-track-index="10" data-volume="1"></audio>

      <!-- Music bed: HeyGen catalog, 120 BPM (beats land on every half second from 0.5 s). Low under the voice,
           swells on the end card once the voice stops, fades out on the last bar. -->
      <audio id="music" class="clip" src="assets/bgm/track.mp3" data-start="0" data-duration="35" data-track-index="9" data-volume="1" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.17},{"t":33.05,"v":0.17},{"t":33.45,"v":0.42},{"t":34.1,"v":0.42},{"t":35,"v":0}]}]}'></audio>

      <!-- Sound effects: each peak lands one frame after its picture -->
      <audio id="sfx-lens" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.38" data-media-start="1.9" data-duration="1.4" data-track-index="11" data-volume="0.32" data-fade-out="0.3"></audio>
      <audio id="sfx-row1" class="clip" src="assets/sfx/pop.mp3" data-start="3.15" data-duration="0.5" data-track-index="12" data-volume="0.38"></audio>
      <audio id="sfx-row2" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.45" data-duration="0.35" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-links" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.49" data-duration="0.57" data-track-index="11" data-volume="0.28"></audio>
      <audio id="sfx-chip1" class="clip" src="assets/sfx/pop.mp3" data-start="4.86" data-duration="0.5" data-track-index="12" data-volume="0.32"></audio>
      <audio id="sfx-glitch1" class="clip" src="assets/sfx/glitch-1.mp3" data-start="4.88" data-duration="1.2" data-track-index="14" data-volume="0.28" data-fade-out="0.3"></audio>
      <audio id="sfx-gap" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.9" data-duration="0.35" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-dive" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="8.58" data-media-start="1.6" data-duration="1.6" data-track-index="11" data-volume="0.3" data-fade-out="0.3"></audio>
      <audio id="sfx-type1" class="clip" src="assets/sfx/typing.mp3" data-start="10.45" data-duration="1.54" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-type2" class="clip" src="assets/sfx/typing.mp3" data-start="11.95" data-duration="1.5" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-send" class="clip" src="assets/sfx/click.mp3" data-start="13.46" data-duration="0.36" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-t1" class="clip" src="assets/sfx/key-press.mp3" data-start="13.8" data-duration="0.43" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-t2" class="clip" src="assets/sfx/key-press.mp3" data-start="14.08" data-duration="0.43" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-ans1" class="clip" src="assets/sfx/pop.mp3" data-start="15.0" data-duration="0.5" data-track-index="12" data-volume="0.36"></audio>
      <audio id="sfx-ans2" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.18" data-duration="0.35" data-track-index="13" data-volume="0.42"></audio>
      <audio id="sfx-ans3" class="clip" src="assets/sfx/pop.mp3" data-start="15.33" data-duration="0.5" data-track-index="16" data-volume="0.32"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="16.18" data-media-start="2.4" data-duration="1.1" data-track-index="17" data-volume="0.16" data-fade-out="0.12"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="17.18" data-duration="1.6" data-track-index="18" data-volume="0.32" data-fade-out="0.4"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="18.35" data-duration="1.4" data-track-index="16" data-volume="0.35" data-fade-out="0.4"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.12" data-duration="0.57" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-plug" class="clip" src="assets/sfx/click.mp3" data-start="20.26" data-duration="0.36" data-track-index="13" data-volume="0.75"></audio>
      <audio id="sfx-ping" class="clip" src="assets/sfx/ping.mp3" data-start="20.04" data-duration="1.0" data-track-index="14" data-volume="0.35" data-fade-out="0.3"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/pop.mp3" data-start="21.76" data-duration="0.5" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-iris" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="22.43" data-media-start="2.0" data-duration="1.0" data-track-index="11" data-volume="0.26" data-fade-out="0.3"></audio>
      <audio id="sfx-cent" class="clip" src="assets/sfx/pop.mp3" data-start="24.24" data-duration="0.5" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-five" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="25.95" data-duration="1.2" data-track-index="18" data-volume="0.22" data-fade-out="0.4"></audio>
      <audio id="sfx-card" class="clip" src="assets/sfx/whoosh.mp3" data-start="27.15" data-duration="0.57" data-track-index="11" data-volume="0.26"></audio>
      <audio id="sfx-x" class="clip" src="assets/sfx/click-soft.mp3" data-start="27.41" data-duration="0.35" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-glitch2" class="clip" src="assets/sfx/glitch-1.mp3" data-start="27.58" data-media-start="0.1" data-duration="1.0" data-track-index="15" data-volume="0.22" data-fade-out="0.3"></audio>
      <audio id="sfx-tiles" class="clip" src="assets/sfx/typing.mp3" data-start="28.18" data-duration="1.54" data-track-index="16" data-volume="0.6" data-fade-out="0.3"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="30.12" data-media-start="2.0" data-duration="1.1" data-track-index="11" data-volume="0.26" data-fade-out="0.3"></audio>
      <audio id="sfx-k1" class="clip" src="assets/sfx/key-press.mp3" data-start="31.18" data-duration="0.43" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-k2" class="clip" src="assets/sfx/key-press.mp3" data-start="31.36" data-duration="0.43" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-post" class="clip" src="assets/sfx/click.mp3" data-start="31.6" data-duration="0.36" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-dm" class="clip" src="assets/sfx/notification.mp3" data-start="32.1" data-duration="1.8" data-track-index="12" data-volume="0.35" data-fade-out="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Ambient light follows the story: lemon (hook), blue (intel), pink/blue (gap), lemon (ask),
      // blue (answer), lemon (brand), blue (key), pink (price), lemon (lookups, CTA)
      const light = [
        [0, "#bg-lemon"], [3.05, "#bg-blue"], [6.0, "#bg-pink"], [9.7, "#bg-lemon"], [13.5, "#bg-blue"],
        [16.95, "#bg-lemon"], [19.35, "#bg-blue"], [22.9, "#bg-pink"], [28.35, "#bg-lemon"],
      ];
      tl.set("#bg-lemon", { opacity: 1 }, 0);
      light.forEach(([t, id], i) => {
        if (i === 0) return;
        const prev = light[i - 1][1];
        if (prev !== id) {
          tl.to(prev, { opacity: 0, duration: 0.45, ease: "power2.inOut" }, t - 0.1);
          tl.to(id, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, t - 0.1);
        }
      });
      // The light drifts slowly so the stage is never static
      tl.fromTo(".bg-glow", { x: -120, y: 60 }, { x: 140, y: -40, duration: 35, ease: "sine.inOut" }, 0);
      tl.fromTo("#bg-grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px -400px", duration: 35, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
