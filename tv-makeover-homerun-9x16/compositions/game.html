<template>

  <script>
    (function () {
      // Pixel world: 180 x 320 logical pixels, each drawn as 6 x 6 on the 1080 x 1920 canvas.
      const W = 180, H = 320, S = 6, DUR = 34.19;
      // Voiceover-locked moments
      const T = {
        click: 2.65, dive: 3.05, diveEnd: 3.45, hit: 4.08, sky: 5.2, tiltDown: 7.2, run: 7.7, go: 8.0,
        b1: 10.3, b2: 14.2, b3: 19.3, panelOff: 23.2, slide: 23.72, home: 24.0, zoomOut: 24.55, zoomOutEnd: 24.95,
        front: 31.0,
      };

      const outC = document.getElementById("game-canvas");
      const out = outC.getContext("2d");
      out.imageSmoothingEnabled = false;
      function mk(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const x = c.getContext("2d");

        return [c, x];
      }
      const [frameC, F] = mk(W, H); // the composed frame
      const [worldC, Wd] = mk(W, H); // the broadcast, full frame
      const [roomC, R] = mk(W, H); // the living room
      const [scrC, Sc] = mk(150, 84); // a TV screen
      const [runC, Rn] = mk(24, 26); // the runner at base resolution, drawn x3

      // ---------- helpers ----------
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const lerp = (a, b, p) => a + (b - a) * p;
      const eio = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
      const eo = (p) => 1 - Math.pow(1 - p, 3);
      const ei = (p) => p * p * p;
      const back = (p) => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2);
      function rng(seed) {
        let a = seed | 0;
        return function () {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function r(c, x, y, w, h, col) {
        c.fillStyle = col;
        c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }
      function px(c, x, y, col) {
        r(c, x, y, 1, 1, col);
      }
      function pixLine(c, x0, y0, x1, y1, col, th = 1) {
        const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
        for (let i = 0; i <= n; i++) {
          const x = lerp(x0, x1, i / n), y = lerp(y0, y1, i / n);
          r(c, x - (th - 1) / 2, y - (th - 1) / 2, th, th, col);
        }
      }
      function ellipse(c, cx, cy, rx, ry, col) {
        for (let y = -ry; y <= ry; y++)
          for (let x = -rx; x <= rx; x++)
            if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) px(c, cx + x, cy + y, col);
      }
      function ring(c, cx, cy, rx, ry, col) {
        const n = Math.max(12, Math.round((rx + ry) * 3));
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          px(c, cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, col);
        }
      }
      function ditherBand(c, x0, x1, y0, y1, colA, colB, off = 0) {
        for (let y = y0; y < y1; y++) {

          for (let x = x0; x < x1; x++) {
            const th = [0.125, 0.625, 0.875, 0.375][((x + off) & 1) + ((y & 1) << 1)];

        }
      }
      function star4(c, x, y, s, col) {
        px(c, x, y, "#ffffff");

      // tiny 3 x 5 font for text inside the pixel world
      const G = {
        A: ["###", "#.#", "###", "#.#", "#.#"], B: ["##.", "#.#", "##.", "#.#", "##."], C: ["###", "#..", "#..", "#..", "###"],

        M: ["#.#", "###", "###", "#.#", "#.#"], N: ["##.", "#.#", "#.#", "#.#", "#.#"], O: ["###", "#.#", "#.#", "#.#", "###"],

        "3": ["##.", "..#", ".#.", "..#", "##."], "4": ["#.#", "#.#", "###", "..#", "..#"], "5": ["###", "#..", "##.", "..#", "##."],
        "7": ["###", "..#", ".#.", ".#.", ".#."], "9": ["###", "#.#", "###", "..#", "###"], ":": ["...", ".#.", "...", ".#.", "..."],
        "%": ["#.#", "..#", ".#.", "#..", "#.#"], "!": [".#.", ".#.", ".#.", "...", ".#."], "+": ["...", ".#.", "###", ".#.", "..."],
        " ": ["...", "...", "...", "...", "..."],
      };
      function tiny(c, str, x, y, col) {
        for (let k = 0; k < str.length; k++) {

        }
      }
      const tinyW = (s) => s.length * 4 - 1;

      // ===================================================================
      // TV SCREEN (150 x 84)
      // ===================================================================
      const APPS = [
        ["#e8463c", "play"], ["#2f6fd6", "note"], ["#3cb371", "ball"], ["#f2a516", "star"],
        ["#1fa3a3", "film"], ["#d64f8a", "heart"], ["#7a5cff", "game"], ["#e07b39", "cam"],
      ];
      const JUNK = [["SHOP", "#9a9a2a"], ["GAME", "#7a3b8f"], ["NEWS", "#8f3b3b"], ["PROMO", "#3b6a8f"], ["DEALS", "#8f6a3b"]];
      function glyph(c, kind, cx, cy, col) {
        const P = {
          play: ["#...", "##..", "###.", "##..", "#..."], note: [".###", ".#.#", ".#.#", "##.#", "##.."],
          ball: [".##.", "#..#", "####", "#..#", ".##."], star: [".#..", "####", ".##.", "#..#", "...."],
          film: ["####", "#..#", "####", "#..#", "####"], heart: ["#.#.", "####", "####", ".##.", "...."],
          game: ["####", "#.##", "####", "#..#", "...."], cam: ["....", "####", "#..#", "####", "...."],
        }[kind];
        for (let j = 0; j < 5; j++) for (let i = 0; i < 4; i++) if (P[j][i] === "#") px(c, cx - 2 + i, cy - 2 + j, col);
      }
      function tile(c, x, y, w, h, col, kind, round) {
        x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
        for (let j = 0; j < h; j++) {
          const inset = round ? (j === 0 || j === h - 1 ? 2 : j === 1 || j === h - 2 ? 1 : 0) : 0;
          r(c, x + inset, y + j, w - 2 * inset, 1, col);
          if (j === 0 && round) r(c, x + inset, y, w - 2 * inset, 1, "rgba(255,255,255,0.35)");
          if (j === h - 1) r(c, x + inset, y + j, w - 2 * inset, 1, "rgba(0,0,0,0.35)");

      }
      function topBar(c, t, clean) {
        r(c, 0, 0, 150, 9, clean ? "rgba(0,0,0,0.35)" : "#111317");
        r(c, 3, 2, 4, 4, "#ffffff");

      // sunset wallpaper
      function wallpaper(c, a, x0 = 0, x1 = 150) {

      }
      // featured card: night skyline art
      function heroCard(c, t, p) {
        if (p <= 0) return;

          r(c, bx, y + h - bh, bw, bh, "#120d2b");

        tiny(c, "PLAY", x + 6, y + h - 9, "#111317");
      }
      const MESSY = (() => {
        const g = rng(7);

          x: 6 + i * 17 + g() * 6, y: 72 + g() * 2, w: 9 + Math.floor(g() * 4), h: 8 + Math.floor(g() * 3),

      })();
      const GRID = (i) => [5 + (i % 4) * 36, 47 + Math.floor(i / 4) * 19, 32, 15];
      // ad chaos
      function adsLayer(c, t, shake) {

        // cursor
        const cx = px0 + 34 + Math.round(Math.sin(t * 2) * 6), cy = py0 + 20;
        const CUR = ["#....", "##...", "#*#..", "#**#.", "#***#", "#**##", "##.#."];
        CUR.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== ".") px(c, cx + i, cy + j, ch === "#" ? "#111317" : "#ffffff"); }));
      }
      const AD_RECTS = [[4, 11, 142, 24], [4, 38, 142, 14], [4, 54, 142, 14], [52, 25, 52, 28]];
      const PARTS = (() => {
        const g = rng(42), list = [];
        const cols = ["#e8463c", "#ffcc33", "#ff7a00", "#ff3d8b", "#ffffff", "#2f6fd6"];
        for (const [x, y, w, h] of AD_RECTS)

            for (let i = 0; i < w; i += 3)

      })();
      function landscape(c, t) {

      function cleanHome(c, t, o) {

      const FINAL = { wall: 1, wipe: 150, hero: 1, snap: () => 1, snapT: () => -1 };
      // the junk clean-up shown on the living-room TV after the home run
      function junkScreen(c, t) {

        r(c, 0, 44, 150, 40, "rgba(10,10,14,0.88)");

        JUNK.forEach(([name, col], i) => {

          }
          if (t >= zap - 0.12 && t < zap + 0.05) pixLine(c, x + 13, 0, x + 13, y + 10, "#ffd447", 3);
          if (t >= zap && t < zap + 0.6) {
            const g = rng(500 + i), dt = t - zap;
            for (let k = 0; k < 16; k++) {
              const a = g() * Math.PI * 2, sp = 10 + g() * 30;
              if (dt > 0.4 && k % 2) continue;
              r(c, x + 13 + Math.cos(a) * sp * eo(dt / 0.6), y + 10 + Math.sin(a) * sp * eo(dt / 0.6), 2, 2, k % 3 ? col : "#ffd447");
            }
          }
        });
        // safe shield
        if (t >= 27.5 && t < 30.6) {
          const s = back(prog(t, 27.5, 27.75));
          const cx = 75, cy = 64;
          const SH = ["..#######..", ".#########.", "###########", "#####.#####", "####...####", "###.#.#.###", ".#..###..#.", ".##.....##.", "..##...##..", "...##.##...", "....###...."];
          SH.forEach((row, j) => [...row].forEach((ch, i) => {
            const xx = cx + (i - 5.5) * 2 * s, yy = cy + (j - 5.5) * 2 * s;

      const PANEL = [15, 64, 150, 84];

        if (t < T.b1 - 0.02 || t >= T.panelOff + 0.3) return;
        const [x, y, w, h] = PANEL;
        const pin = back(prog(t, T.b1, T.b1 + 0.3));
        const pout = t >= T.panelOff ? prog(t, T.panelOff, T.panelOff + 0.3) : 0;
        const cx = x + w / 2, cy = y + h / 2;
        const sc = clamp(0.2 + 0.8 * pin, 0, 1.2) * (1 - 0.15 * pout);
        c.save();
        c.translate(cx, cy);
        c.scale(sc, sc);
        c.translate(-cx, -cy);
        r(c, x - 5, y - 5, w + 10, h + 14, "#1b1b22");
        r(c, x - 5, y - 5, w + 10, 1, "#34343f");
        r(c, x - 5, y + h + 1, w + 10, 1, "#ffd447");
        px(c, x + w + 2, y + h + 5, "#e8463c");
        r(c, x, y, w, h, "#05060a");
        drawScreen(t, "panel");
        for (const tt of [T.b2, T.b3]) if (t >= tt && t < tt + 0.12) crtStatic(Sc, t);
        const on = prog(t, T.b1, T.b1 + 0.22);
        let vis = h;
        if (on < 1) vis = Math.max(1, Math.round(h * eo(on)));
        if (pout > 0) vis = Math.max(1, Math.round(h * (1 - eo(pout))));
        const sy = Math.round(y + (h - vis) / 2);
        c.drawImage(scrC, 0, Math.round((h - vis) / 2), w, vis, x, sy, w, vis);
        if (on < 1 || pout > 0) r(c, x, sy + Math.floor(vis / 2), w, 1, "#ffffff");
        c.restore();
      }

      // ===================================================================
      // LIVING ROOM
      // ===================================================================
      function person(c, cx, cy, rx, hair, shirt, style, armsUp, remote, t, i) {
        const ry = rx;
        const shW = rx * 3;
        r(c, cx - shW / 2, cy + ry - 1, shW, ry * 2, shirt);
        if (armsUp) {
          const wave = Math.round(Math.sin(t * 10 + i) * 2);
          const aw = Math.max(2, Math.round(rx / 2));
          r(c, cx - shW / 2 - 1 + wave, cy - ry * 2, aw, ry * 3, shirt);
          r(c, cx + shW / 2 - aw + 1 - wave, cy - ry * 2, aw, ry * 3, shirt);
          r(c, cx - shW / 2 - 1 + wave, cy - ry * 2 - 3, aw, 3, "#e0a37a");
          r(c, cx + shW / 2 - aw + 1 - wave, cy - ry * 2 - 3, aw, 3, "#e0a37a");
        }
        px(c, cx - rx - 1, cy, "#e0a37a");
        px(c, cx + rx + 1, cy, "#e0a37a");
        ellipse(c, cx, cy, rx, ry, hair);
        if (style === "long") r(c, cx - rx, cy, rx * 2 + 1, ry + 4, hair);
        if (style === "tail") { r(c, cx + rx, cy - 1, 2, 2, hair); r(c, cx + rx + 1, cy + 1, 2, 4, hair); }
        if (remote) {
          const p = remote;
          const hx = cx + rx + 3 + 4 * p, hy = cy + ry + 2 - 14 * p;
          pixLine(c, cx + rx + 1, cy + ry + 3, hx, hy, shirt, 2);
          r(c, hx - 1, hy - 5, 3, 6, "#1b1b1f");
          px(c, hx, hy - 5, "#e8463c");
          r(c, hx - 1, hy, 3, 2, "#e0a37a");
        }
      }
      const FAM = [
        { x: 50, hair: "#2b1d14", shirt: "#3a6ea5", s: "short", adult: 1 },
        { x: 80, hair: "#6b3b1f", shirt: "#2f9e8f", s: "long", adult: 1 },
        { x: 110, hair: "#1f1a17", shirt: "#e0b23a", s: "short", adult: 0 },
        { x: 138, hair: "#8a5a2b", shirt: "#d0567a", s: "tail", adult: 0 },
      ];
      function confetti(c, t, t0, n, seed) {
        if (t < t0) return;
        const g = rng(seed), dt = t - t0;
        const cols = ["#ffd447", "#e8463c", "#49d17a", "#5fb3ff", "#ff6fb5", "#ffffff"];
        for (let i = 0; i < n; i++) {
          const x0 = g() * 180, delay = g() * 2.5, sp = 26 + g() * 30, sway = g() * 6.28;
          const u = dt - delay;
          if (u < 0) continue;
          const y = -6 + ((u * sp) % 340);
          const x = x0 + Math.sin(u * 3 + sway) * 6;
          const flip = Math.floor(u * 8 + i) % 2;
          r(c, x, y, flip ? 2 : 1, flip ? 1 : 2, cols[i % cols.length]);
        }
      }
      function drawRoom(t) {
        const c = R;
        r(c, 0, 0, W, 196, "#e7b97f");
        for (let x = 4; x < W; x += 10) r(c, x, 0, 2, 196, "#dcaa70");
        r(c, 0, 196, W, 4, "#7a4a2e");
        r(c, 0, 200, W, 120, "#9b6440");
        for (let y = 206; y < H; y += 8) r(c, 0, y, W, 1, "#8a5636");
        r(c, 2, 176, 10, 20, "#a0522d");
        for (let k = 0; k < 5; k++) r(c, 1 + k * 2, 160 + (k % 3) * 4, 3, 18 - (k % 3) * 4, "#3a8f4a");
        r(c, 168, 150, 10, 8, "#f3d9a3");
        r(c, 172, 158, 2, 38, "#333338");
        r(c, 24, 154, 132, 6, "#5a3a26");
        r(c, 24, 154, 132, 1, "#6e4930");
        r(c, 10, 59, 160, 94, "#17171b");
        r(c, 10, 59, 160, 1, "#2c2c33");
        px(c, 89, 151, "#e8463c");
        const cheering = t >= 24.6;
        FAM.forEach((f, i) => {
          const jump = cheering ? Math.round(Math.abs(Math.sin((t - 24.6) * 7 + i * 1.3)) * 4) : 0;
          const rx = f.adult ? 8 : 6, cy = (f.adult ? 214 : 220) - jump;
          const remote = i === 0 && t >= 2.3 && t < 3.3 ? eo(prog(t, 2.3, 2.6)) : 0;
          person(c, f.x, cy, rx, f.hair, f.shirt, f.s, cheering, remote, t, i);
        });
        r(c, 8, 232, 164, 88, "#b5443b");
        r(c, 8, 232, 164, 2, "#c95a4f");
        r(c, 8, 270, 164, 50, "#9e3a32");
        for (let x = 48; x < 172; x += 42) r(c, x, 234, 1, 36, "#9e3a32");
        r(c, 2, 224, 12, 96, "#a33a32"); r(c, 2, 224, 12, 2, "#c95a4f");
        r(c, 166, 224, 12, 96, "#a33a32"); r(c, 166, 224, 12, 2, "#c95a4f");
        if (cheering) {
          const g = rng(8);
          for (let k = 0; k < 10; k++) {
            const ph = ((t - 24.6) * 1.4 + g()) % 1;
            r(c, 96 + (g() - 0.5) * 40 * ph, 232 - 40 * Math.sin(Math.PI * ph), 2, 2, "#fff3c4");
          }
          r(c, 88, 230, 16, 4, "#e8463c");
        }
      }
      // front view: the family on the couch cheering at the camera
      function drawFront(t) {
        const c = R;
        const u = t - T.front;
        r(c, 0, 0, W, 320, "#e7b97f");
        for (let x = 4; x < W; x += 10) r(c, x, 0, 2, 320, "#dcaa70");
        r(c, 36, 68, 3, 18, "#5a3a26");
        for (let j = 0; j < 14; j++) r(c, 39, 69 + j, Math.max(1, 56 - j * 4), 1, "#d23a32");
        tiny(c, "HOME RUN", 42, 72, "#ffffff");
        c.save(); c.globalAlpha = 0.16 + 0.05 * Math.sin(t * 9); r(c, 0, 0, W, 320, "#9fd0ff"); c.restore();
        r(c, 6, 206, 168, 40, "#b5443b");
        r(c, 6, 206, 168, 2, "#c95a4f");
        const P = [
          { x: 40, hair: "#2b1d14", shirt: "#3a6ea5", skin: "#e0a37a", h: 12, kid: 0 },
          { x: 76, hair: "#6b3b1f", shirt: "#2f9e8f", skin: "#d69a72", h: 12, kid: 0, long: 1 },
          { x: 112, hair: "#1f1a17", shirt: "#e0b23a", skin: "#e0a37a", h: 10, kid: 1 },
          { x: 144, hair: "#8a5a2b", shirt: "#d0567a", skin: "#e8b48c", h: 10, kid: 1, tail: 1 },
        ];
        P.forEach((p, i) => {
          const jump = p.kid ? Math.round(Math.abs(Math.sin(u * 7 + i)) * 10) : Math.round(Math.abs(Math.sin(u * 6 + i)) * 3);
          const hy = 214 - p.h - jump;
          const bw = p.h * 2 + 4;
          r(c, p.x - bw / 2, hy + p.h * 2 - 2, bw, 40, p.shirt);
          const wv = Math.round(Math.sin(u * 10 + i) * 3);
          pixLine(c, p.x - bw / 2, hy + p.h * 2, p.x - bw / 2 - 6 + wv, hy - 4, p.shirt, 3);
          pixLine(c, p.x + bw / 2, hy + p.h * 2, p.x + bw / 2 + 6 - wv, hy - 4, p.shirt, 3);
          r(c, p.x - bw / 2 - 8 + wv, hy - 8, 4, 4, p.skin);
          r(c, p.x + bw / 2 + 4 - wv, hy - 8, 4, 4, p.skin);
          ellipse(c, p.x, hy + p.h, p.h - 2, p.h, p.skin);
          for (let y = -p.h; y < -p.h / 3; y++)
            for (let x = -p.h + 2; x <= p.h - 2; x++)
              if ((x * x) / ((p.h - 2) * (p.h - 2)) + (y * y) / (p.h * p.h) <= 1) px(c, p.x + x, hy + p.h + y, p.hair);
          if (p.long) { r(c, p.x - p.h + 1, hy + p.h - 4, 3, p.h + 6, p.hair); r(c, p.x + p.h - 4, hy + p.h - 4, 3, p.h + 6, p.hair); }
          if (p.tail) r(c, p.x + p.h - 2, hy + 2, 4, 6, p.hair);
          const ey = hy + p.h - 1;
          r(c, p.x - 5, ey, 3, 1, "#2a1a12"); px(c, p.x - 5, ey + 1, "#2a1a12");
          r(c, p.x + 3, ey, 3, 1, "#2a1a12"); px(c, p.x + 5, ey + 1, "#2a1a12");
          r(c, p.x - 3, ey + 4, 7, 4, "#5a1a1a");
          r(c, p.x - 2, ey + 4, 5, 1, "#ffffff");
          r(c, p.x - 1, ey + 7, 3, 1, "#e8463c");
          px(c, p.x - 7, ey + 3, "#f08a8a"); px(c, p.x + 7, ey + 3, "#f08a8a");
        });
        r(c, 0, 250, 180, 70, "#a33a32");
        r(c, 0, 250, 180, 3, "#c95a4f");
        r(c, 0, 230, 16, 90, "#b5443b"); r(c, 164, 230, 16, 90, "#b5443b");
        r(c, 0, 230, 16, 2, "#c95a4f"); r(c, 164, 230, 16, 2, "#c95a4f");
        r(c, 82, 244, 18, 7, "#e8463c"); r(c, 82, 244, 18, 1, "#ff8a7a");
        for (let k = 0; k < 7; k++) r(c, 84 + k * 2, 241 + (k % 2), 2, 2, "#fff3c4");
        confetti(c, t, T.front - 0.5, 110, 77);
      }

      // ===================================================================
      // COMPOSE
      // ===================================================================
      const TV = [15, 64, 150, 84];
      function scanlines(x, y, w, h, a = 0.12) {
        out.fillStyle = `rgba(0,0,0,${a})`;
        for (let yy = y; yy < y + h; yy += 6) out.fillRect(x, yy + 4, w, 2);
      }
      function drawBroadcast(t) {
        Wd.clearRect(0, 0, W, H);
        if (t < T.sky) drawBatter(t);
        else if (t < T.run) drawSky(t);
        else drawRunScene(t, false);
      }
      function screenInRoom(t) {
        if (t < T.click) { drawScreen(t, "panel"); return; }
        if (t < T.dive) { crtStatic(Sc, t); return; }
        if (t < 24.95) {
          drawBroadcast(t);
          Sc.clearRect(0, 0, 150, 84);
          Sc.drawImage(worldC, 0, 140, 180, 101, 0, 0, 150, 84);
          return;
        }
        if (t < 25.07) { crtStatic(Sc, t); return; }
        drawScreen(t, "junk");
      }
      function renderAt(t) {
        t = clamp(t, 0, DUR);
        F.clearRect(0, 0, W, H);
        let scan = null;
        if (t < T.dive) {
          screenInRoom(t);
          drawRoom(t);
          F.drawImage(roomC, 0, 0);
          F.drawImage(scrC, TV[0], TV[1]);
          scan = TV;
        } else if (t < T.diveEnd || (t >= T.zoomOut && t < T.zoomOutEnd)) {
          // dive into the broadcast, or pull back out of it into the family's TV
          const p = t < T.diveEnd ? ei(prog(t, T.dive, T.diveEnd)) : 1 - eio(prog(t, T.zoomOut, T.zoomOutEnd));
          drawRoom(t);
          drawBroadcast(t);
          const s = lerp(1, 2.4, p), cx = 90, cy = 106;
          F.save(); F.translate(cx, cy); F.scale(s, s); F.translate(-cx, -cy); F.drawImage(roomC, 0, 0); F.restore();
          const sr = [lerp(TV[0], 0, p), lerp(TV[1], 0, p), lerp(TV[2], 180, p), lerp(TV[3], 320, p)];
          const cr = [0, lerp(140, 0, p), 180, lerp(101, 320, p)];
          r(F, sr[0] - 5, sr[1] - 5, sr[2] + 10, sr[3] + 10, "#17171b");
          F.drawImage(worldC, cr[0], cr[1], cr[2], cr[3], sr[0], sr[1], sr[2], sr[3]);
          scan = sr.map(Math.round);
        } else if (t < T.zoomOut) {
          drawBroadcast(t);
          F.drawImage(worldC, 0, 0);
          scan = [0, 0, 180, 320];
        } else if (t < T.front) {
          screenInRoom(t);
          drawRoom(t);
          F.drawImage(roomC, 0, 0);
          F.drawImage(scrC, TV[0], TV[1]);
          confetti(F, t, 24.6, 90, 41);
          scan = TV;
        } else {
          drawFront(t);
          F.drawImage(roomC, 0, 0);
        }
        out.clearRect(0, 0, 1080, 1920);
        out.drawImage(frameC, 0, 0, W, H, 0, 0, 1080, 1920);
        if (scan) scanlines(scan[0] * S, scan[1] * S, scan[2] * S, scan[3] * S);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(state.t) }, 0);
      renderAt(0);
      window.__timelines["game"] = tl;
    })();
  </script>
</template>
