          if ((i + Math.floor(t * 3)) % 2) { c.fillStyle = "#ffd447"; rr(c, x + w - 40, y + 8, 32, 20, 4); c.fill(); txt(c, "AD", x + w - 24, y + 23, font(800, 13), "#111", "center"); }

          if (hiVis < 1) { out.fillStyle = "#ffffff"; out.fillRect(x, y + h / 2 - 2, w, 4); }
        }
        // ball tracking: from the pitcher's release, through the hit, out of the park
        if (t >= PITCH.release && t < PITCH.out) {
          const pts = [];
          for (let k = PITCH.release; k <= t; k += 0.01) { const b = ballClose(k); if (b) pts.push([b[0], b[1]]); }
          tracer(pts.filter((_, i) => i < 34 || t < PITCH.contact ? true : true), t < PITCH.contact ? "#ff3b30" : "#ffcc00");
          if (t < PITCH.contact + 0.05) {
            out.save(); out.strokeStyle = "rgba(255,255,255,0.9)"; out.lineWidth = 4;
            out.strokeRect(104 * S, 206 * S, 24 * S, 34 * S);
            out.restore();
          }
        }
        if (t >= PITCH.out && t < 6.6) {
          const pts = [];
          for (let k = PITCH.out; k <= t; k += 0.02) { const b = ballOver(k); if (b) pts.push([camT.fx + camT.dx + (b[0] - camT.fx) * camT.z, camT.fy + camT.dy + (b[1] - camT.fy) * camT.z]); }
          tracer(pts, "#ffcc00");
        }
      }

      window.addEventListener("hf-seek", (e) => {
        const tt = e.detail.time * SPEED;
        renderAt(tt);
        if (e.detail.waitUntil) e.detail.waitUntil(assetsReady.then(() => renderAt(tt)));
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.game = assetsReady;
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: DUR, duration: DUR / SPEED, ease: "none", onUpdate: () => renderAt(state.t) }, 0);
      renderAt(0);
      assetsReady.then(() => renderAt(state.t));
      window.__timelines["game"] = tl;
    })();
  </script>
</template>
