    (function () {
      var tl = gsap.timeline({ paused: true });

      // build the calendar: 35 cells, October-style (starts on a Wednesday), dots on a baked schedule
      var grid = document.getElementById("f5-grid");
      var dots = [];
      var SCHED = {};   // day -> kinds
      for (var d = 1; d <= 31; d++) { SCHED[d] = ["p"]; if (d % 3 === 0) SCHED[d].push("r"); if (d % 7 === 5) SCHED[d].push("s"); }
      for (var c = 0; c < 35; c++) {
        var cell = document.createElement("div"); cell.className = "f5-cell";
        var day = c - 1;                                   // the 1st sits in the third column
        if (day >= 1 && day <= 31) {
          cell.textContent = String(day);
          SCHED[day].forEach(function (k) { var i = document.createElement("i"); i.className = k; i.id = "f5-d" + day + k; cell.appendChild(i); dots.push("#" + i.id); });
        } else { cell.style.opacity = "0.35"; }
        grid.appendChild(cell);
      }

      gsap.set("#f5-dip", { opacity: 0 });
      gsap.set(dots, { scale: 0, opacity: 0 });
      gsap.set(".f5-step em", { scale: 0, opacity: 0 });
      gsap.set("#f5-linefill", { scaleX: 0 });
      gsap.set(".bx-toast", { x: 120, opacity: 0 });
      gsap.set(".f5-k", { opacity: 0 });

      // 0.0  the impact: the calendar lands, the bloom hits, the title arrives

      tl.fromTo("#f5-bloom", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo("#f5-title", { x: 80, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" }, 0.2);
      tl.fromTo("#f5-rail", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 0.4);
      // the month fills in a wave, 1 frame apart (31 days × 1-3 dots)
      dots.forEach(function (sel, i) {
        tl.fromTo(sel, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, 0.25 + i * 0.028);
      });

      // 1.0  the rail lights step by step on the beats; the line draws between them
      ["#f5-s0", "#f5-s1", "#f5-s2", "#f5-s3"].forEach(function (s, i) {
        tl.fromTo(s + " em", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 1.0 + i * 0.5);
        tl.fromTo(s, { color: "#9F97BE" }, { color: "#F5F2FF", duration: 0.3 }, 1.0 + i * 0.5);
      });
      tl.to("#f5-linefill", { scaleX: 1, duration: 1.6, ease: "power1.inOut" }, 1.0);

      // 1.5  toasts stack in from the right, 0.8 s apart
      ["#f5-t0", "#f5-t1", "#f5-t2"].forEach(function (t, i) {
        tl.fromTo(t, { x: 120, opacity: 0, scale: 0.94 }, { x: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.3 + i * 0.7);
      });

      // 3.0  the counters land, growing with their value
      [["#f5-n0", 31], ["#f5-n1", 24], ["#f5-n2", 12]].forEach(function (p, i) {
        var proxy = { n: 0 }, el = document.querySelector(p[0]);
        tl.to(proxy, { n: p[1], duration: 1.2, ease: "power3.out", onUpdate: function () { el.textContent = String(Math.round(proxy.n)); } }, 3.0 + i * 0.15);
        tl.fromTo(p[0], { scale: 0.7 }, { scale: 1, duration: 0.9, ease: "back.out(1.3)" }, 3.0 + i * 0.15);

      });
