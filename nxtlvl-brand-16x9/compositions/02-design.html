  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var HEAD = "Monsoon combo";
      var headTxt = document.getElementById("f2-head-txt");

      gsap.set("#f2-dip", { opacity: 0 });
      gsap.set("#f2-cursor", { x: 1500, y: 1180 });
      gsap.set("#f2-ripple", { x: 1500, y: 1180, scale: 0.2, opacity: 0 });

      gsap.set("#f2-head", { opacity: 0 });
      gsap.set("#f2-caret", { opacity: 0 });

      // 0.0  the drop: the card is already there; the photo lands into it from above and the bloom blooms
      tl.fromTo("#f2-card", { scale: 0.96, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 0);
      tl.fromTo("#f2-photo", { yPercent: -70, scale: 1.25, opacity: 0 }, { yPercent: 0, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.02);

      tl.fromTo("#f2-bar", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 0.35);

      // 0.3  the headline column: title blurs in, chips waterfall, the note
      tl.fromTo("#f2-title", { x: 60, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" }, 0.3);
      ["#f2-c0", "#f2-c1", "#f2-c2", "#f2-c3", "#f2-c4"].forEach(function (c, i) {
        tl.fromTo(c, { y: 50, opacity: 0, rotation: 3 }, { y: 0, opacity: 1, rotation: 0, duration: 0.45, ease: "circ.out" }, 1.0 + i * 0.1);
      });
      tl.fromTo("#f2-note", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.7);

      // 1.0  brand kit: the swatches pop in (beats), the font chip slides out, and the card takes the brand
      ["#f2-sw0", "#f2-sw1", "#f2-sw2"].forEach(function (s, i) {
        tl.fromTo(s, { scale: 0, opacity: 0, rotation: -25 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(1.6)" }, 1.0 + i * 0.25);
      });
      tl.fromTo("#f2-font", { scale: 0.6, opacity: 0, x: -30 }, { scale: 1, opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.4)" }, 1.75);
      tl.to("#f2-flood", { scaleY: 1, duration: 0.5, ease: "expo.out" }, 1.6);
      tl.fromTo("#f2-logo", { scale: 0, opacity: 0, rotation: -90 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, 1.85);

      // 2.0  the headline types itself (seek-safe: a proxy counter sets the text at every seek)
      var typed = { n: 0 };
      tl.set("#f2-head", { opacity: 1 }, 2.0);
      tl.set("#f2-caret", { opacity: 1 }, 2.0);
      tl.to(typed, { n: HEAD.length, duration: 1.1, ease: "none", onUpdate: function () { headTxt.textContent = HEAD.slice(0, Math.round(typed.n)); } }, 2.0);
      // caret blink as a square wave on the timeline clock (finite)
      for (var k = 0; k < 6; k++) { tl.set("#f2-caret", { opacity: k % 2 ? 1 : 0 }, 3.1 + k * 0.25); }
      tl.set("#f2-caret", { opacity: 0 }, 4.6);
      tl.fromTo("#f2-tag", { scale: 0, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 3.5);

      // 4.0  the cursor arrives from off-stage, slows into the Approve button, lands a little off centre, presses

      tl.to("#f2-cursor", { scale: 0.86, duration: 0.08, ease: "power2.in" }, 4.5);
      tl.to("#f2-cursor", { scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.58);
      tl.to("#f2-approve", { scale: 0.92, duration: 0.08, ease: "power2.in" }, 4.5);
      tl.to("#f2-approve", { scale: 1, duration: 0.34, ease: "back.out(2.2)" }, 4.58);
      tl.set("#f2-ripple", { x: 742, y: 936, scale: 0.2, opacity: 0.9 }, 4.5);

      tl.fromTo("#f2-badge", { scale: 1.8, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(1.5)" }, 4.62);
      tl.fromTo("#f2-approve", { backgroundColor: "#7D18FC" }, { backgroundColor: "#52E39B", duration: 0.3, ease: "power2.out" }, 4.6);
      tl.to("#f2-cursor", { x: 820, y: 1010, opacity: 0, duration: 0.4, ease: "power2.in" }, 5.1);

      // 5.72  exit: the whole world whips left and blurs into the reels scene
