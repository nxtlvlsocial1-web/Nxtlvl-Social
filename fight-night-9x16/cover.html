<!doctype html>
<html lang="en">
  <head>

    <title>Fight Night cover</title>
    <!-- Reel cover still: the same 3D arena as index.html, posed for a versus card. Snapshot with build/cover.cjs. -->
    <script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.min.js"}}</script>
    <style>
@font-face { font-family: "Manrope"; font-weight: 200 800; src: url("assets/fonts/manrope.ttf"); }
@font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("assets/fonts/fraunces-italic.ttf"); }
@font-face { font-family: "JBMono"; font-weight: 100 800; src: url("assets/fonts/jbmono.ttf"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0814; }
body { font-family: "Manrope", sans-serif; color: #fff; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
.layer { position: absolute; inset: 0; }
/* red and blue halves */
.tint { background:
  radial-gradient(70% 45% at 0% 62%, rgba(224,49,64,.35), transparent 70%),
  radial-gradient(70% 45% at 100% 62%, rgba(47,107,255,.35), transparent 70%);
  mix-blend-mode: screen; }
.vig { background:
  linear-gradient(#0b0814 0%, rgba(11,8,20,.92) 14%, rgba(11,8,20,.35) 30%, transparent 40%),
  linear-gradient(0deg, #0b0814 0%, rgba(11,8,20,.9) 14%, rgba(11,8,20,.3) 30%, transparent 40%); }
.slash { position: absolute; left: 528px; top: 640px; width: 24px; height: 900px; transform: rotate(14deg);
  background: linear-gradient(transparent, #fff 20%, #ffd84a 50%, #fff 80%, transparent);
  box-shadow: 0 0 40px 10px rgba(255,216,74,.55); border-radius: 12px; opacity: .9; }
.c { position: absolute; left: 0; width: 1080px; text-align: center; }
.tag { top: 268px; font: 800 30px "JBMono"; letter-spacing: 10px; color: #ffd84a; text-shadow: 0 0 24px rgba(255,216,74,.6); }
.h1 { top: 318px; font: 800 150px/0.98 "Manrope"; letter-spacing: -5px; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
.h1 .r { color: #ff4a58; } .h1 .b { color: #5b8cff; }
.h2 { top: 640px; font: italic 600 74px "Fraunces"; color: #ffb347; letter-spacing: -1px; text-shadow: 0 6px 24px rgba(0,0,0,.7); }
.vs { position: absolute; left: 0; width: 1080px; top: 905px; text-align: center; font: 800 230px/1 "Manrope"; letter-spacing: -14px;
  color: #ffd84a; transform: skewX(-10deg); -webkit-text-stroke: 10px #120a1e; paint-order: stroke fill;
  text-shadow: 0 0 60px rgba(255,216,74,.55), 0 18px 0 #120a1e; }
.plate { position: absolute; top: 1330px; width: 470px; padding: 22px 28px 26px; border-radius: 24px; background: rgba(10,8,18,.86); }
.plate.red { left: 40px; border: 4px solid #e03140; box-shadow: 0 0 60px rgba(224,49,64,.55); transform: rotate(-2deg); }
.plate.blue { right: 40px; border: 4px solid #2f6bff; box-shadow: 0 0 60px rgba(47,107,255,.55); transform: rotate(2deg); text-align: right; }
.corner { font: 800 22px "JBMono"; letter-spacing: 5px; color: #ff8a92; }
.blue .corner { color: #8fb0ff; }
.who { font: 800 50px "Manrope"; letter-spacing: -1px; margin-top: 4px; }
.says { display: inline-block; margin-top: 10px; font: 800 44px "Manrope"; padding: 6px 20px; border-radius: 14px; background: #e03140; }
.blue .says { background: #2f6bff; }
.foot { top: 1578px; font: 700 34px "Manrope"; color: #fff; }
.foot b { font: 800 34px "JBMono"; color: #111; background: #ffb347; padding: 4px 16px; border-radius: 10px; margin: 0 6px; }
.foot span { color: rgba(255,255,255,.75); }
    </style>

</html>
