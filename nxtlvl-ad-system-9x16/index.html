    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        // keep the face centre (source 540, 850) at (540, 550) in the 1080x960 window at any zoom
        function frame(s) { return { scale: s, x: 540 * (1 - s), y: 550 - 850 * s }; }
        tl.set("#cam", frame(1.0), 0.0);
        tl.set("#cam", frame(1.15), 3.8333);
        tl.set("#cam", frame(1.0), 6.1);
        tl.set("#cam", frame(1.1), 8.2333);
        tl.set("#cam", frame(1.0), 10.1667);
        tl.set("#cam", frame(1.1), 12.7667);
        tl.set("#cam", frame(1.22), 15.2);
        tl.set("#cam", frame(1.0), 16.7667);
        tl.set("#cam", frame(1.12), 18.0);
        tl.set("#cam", frame(1.26), 4.5);                 // "A system." - tighter, inside the same cut
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
