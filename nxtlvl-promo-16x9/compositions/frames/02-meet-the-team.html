  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-meet-the-team"]') || document;
      var $ = function (s) { return root.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var BEAT = 0.5;                 // 120 BPM — kicks on every frame-local 0.5 s
      var POSTS = 9;                  // landings at 0.0, 0.5 … 4.0
      var DUR = 6;
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–0.25): the drop — stage snaps back from the push, empty state clears ----
      tl.fromTo($("#f2-cam"), { scale: 1.08, transformOrigin: "960px 470px" },
        { scale: 1, duration: 0.25, ease: "expo.out" }, 0);
      tl.fromTo($("#f2-dropglow"), { opacity: 0.85 }, { opacity: 0, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo($("#f2-empty"), { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.18, ease: "power2.out" }, 0);
      tl.fromTo($$(".f2-slot, .f2-rest"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);

      // ---- Scene 2 (0.0–4.0): one post slams into its slot per kick, with a white flash ----
      for (var i = 0; i < POSTS; i++) {
        var at = i * BEAT;
        var post = $("#f2-t" + (i + 1));
        tl.fromTo(post, { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, at);
        tl.fromTo(post.querySelector(".f2-flash"), { opacity: 0.9 },
          { opacity: 0, duration: 0.38, ease: "power2.out" }, at);
      }

      // posts stat ticks quietly just after each landing (driven by one clock — seek-safe)
      var countEl = $("#f2-count");
      var clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var n = Math.floor((clock.t - 0.08) / BEAT) + 1;
          n = Math.max(0, Math.min(POSTS, n));
          if (countEl.textContent !== String(n)) countEl.textContent = String(n);
        }
      }, 0);

      // kinetic beat slam — a different entrance per phrase, on the beat grid
      tl.fromTo($("#f2-meet-a"), { scale: 1.45, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, 0);
      tl.fromTo($("#f2-meet-b"), { x: -220, opacity: 0, filter: "blur(10px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, BEAT * 1);

      // serif words with a glow that blooms then settles
      var GLOW_0 = "0px 0px 0px rgba(169,92,255,0)";
      var GLOW_PEAK = "0px 0px 64px rgba(169,92,255,0.95)";
      var GLOW_REST = "0px 0px 26px rgba(169,92,255,0.22)";
      tl.fromTo($("#f2-team-a"), { y: 70, opacity: 0, filter: "blur(12px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "circ.out" }, BEAT * 2);
      tl.fromTo($("#f2-team-b"), { y: 50, scale: 0.92, opacity: 0, filter: "blur(10px)" },
        { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, BEAT * 3);
      [["#f2-team-a", BEAT * 2], ["#f2-team-b", BEAT * 3]].forEach(function (w) {
        var el = $(w[0]);
        tl.fromTo(el, { textShadow: GLOW_0 }, { textShadow: GLOW_PEAK, duration: 0.3, ease: "power2.out" }, w[1]);
        tl.fromTo(el, { textShadow: GLOW_PEAK }, { textShadow: GLOW_REST, duration: 0.9, ease: "sine.out", immediateRender: false }, w[1] + 0.3);
      });

      // ---- Scene 3 (4.0–5.0): pills pop in one per half-beat, right-aligned ----
      ["#f2-pill1", "#f2-pill2", "#f2-pill3", "#f2-pill4"].forEach(function (sel, k) {
        tl.fromTo($(sel), { scale: 0, opacity: 0, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.0 + k * 0.25);
      });

      // ---- Scene 4 (5.0–6.0): "by nxtlvl ✦" reveals, the spark twinkles once, then hold ----
      tl.fromTo($("#f2-by-txt"), { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.0);
      tl.fromTo($("#f2-mark"), { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" }, 5.05);
      var spark = $("#f2-spark");
      tl.fromTo(spark, { scale: 0, rotation: -90, opacity: 0 },
        { scale: 1.35, rotation: 0, opacity: 1, duration: 0.24, ease: "power3.out" }, 5.5);
      tl.fromTo(spark, { scale: 1.35 },
        { scale: 1, duration: 0.24, ease: "sine.inOut", immediateRender: false }, 5.74);
      tl.fromTo(spark, { filter: "drop-shadow(0px 0px 0px rgba(216,187,255,0))" },
        { filter: "drop-shadow(0px 0px 10px rgba(216,187,255,0.95))", duration: 0.18, ease: "power2.out" }, 5.5);
      tl.fromTo(spark, { filter: "drop-shadow(0px 0px 10px rgba(216,187,255,0.95))" },
        { filter: "drop-shadow(0px 0px 0px rgba(216,187,255,0))", duration: 0.3, ease: "sine.out", immediateRender: false }, 5.68);

      // hold — subtle drift on the flanking type only (the phone stays static for the handoff)
      tl.fromTo($("#f2-meet"), { y: 0 }, { y: -3, duration: 1.0, ease: "sine.inOut" }, 5.0);
      tl.fromTo($("#f2-pills"), { y: 0 }, { y: -2, duration: 1.0, ease: "sine.inOut" }, 5.0);
      tl.fromTo($("#f2-team"), { y: 0 }, { y: -3, duration: 1.0, ease: "sine.inOut" }, 5.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-meet-the-team"] = tl;
    })();
  </script>
