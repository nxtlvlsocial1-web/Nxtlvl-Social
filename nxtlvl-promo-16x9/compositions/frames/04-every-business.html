        <div data-hf-id="hf-9ar0" class="nx-serif" id="f4-h2" style="font-size:96px; line-height:1; margin-top:6px"><span data-hf-id="hf-grfh" id="f4-h2in">agencies won't call back.<svg data-hf-id="hf-da5j" id="f4-ul" viewBox="0 0 720 26" aria-hidden="true"><path data-hf-id="hf-o9ar" id="f4-ul-path" d="M 8 15 C 120 8, 250 19, 372 13 S 600 9, 712 12" /></svg></span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // t = 0 is film 18.0 s. 120 BPM, beat = 0.5 s (assets/music/beatgrid.json).
      const BEAT = 0.5;

      // Static layout, placed here instead of inline CSS so no element mixes a CSS transform with GSAP.
      gsap.set("#f4-world .nx-phone", { scale: 0.6, transformOrigin: "0 0" });
      gsap.set("#f4-world", { transformOrigin: "0 0" });

      // ---- Scene 1 (0.0-1.8): ONE continuous decelerating pull-back on the world (viewport-change) ----
      // Handoff: frame 3 left the café phone at left 770, top 80, scale 1. Its wall slot is left 846, top 96,
      // scale 0.6, origin 0 0. With origin 0 0 a world point p lands at S*p + T, so S0 = 1 / 0.6 and
      // T0 = handoff - S0 * slot. Scale and translate share one tween and one ease (single source of truth).
      const SLOT = { x: 846, y: 96, s: 0.6 };
      const HAND = { x: 770, y: 80, s: 1 };
      const S0 = HAND.s / SLOT.s;
      const X0 = HAND.x - S0 * SLOT.x; // -640
      const Y0 = HAND.y - S0 * SLOT.y; // -80
      tl.fromTo("#f4-world", { x: X0, y: Y0, scale: S0 }, { x: 0, y: 0, scale: 1, duration: 1.8, ease: "expo.out", force3D: false }, 0);

      // Light directional (horizontal) blur on the world through the fastest part of the pull only:
      // sharp at the handoff frame, peaks at 0.08 s, back to ~0 by 1.0 s, filter removed at 1.2 s.
      tl.fromTo("#f4-dblur-k", { attr: { stdDeviation: "0.01 0" } }, { attr: { stdDeviation: "3.5 0" }, duration: 0.08, ease: "power1.out" }, 0);
      tl.fromTo("#f4-dblur-k", { attr: { stdDeviation: "3.5 0" } }, { attr: { stdDeviation: "0.01 0" }, duration: 0.92, ease: "power2.out", immediateRender: false }, 0.08);
      tl.set("#f4-world", { filter: "none" }, 1.2);

      // The six neighbours (feeds already full) materialise as the camera pulls out, nearest first,
      // so the cut from frame 3 opens on the café phone alone.
      [[3, 5], [2, 6], [1, 7]].forEach(function (pair, d) {
        pair.forEach(function (n) {
          tl.fromTo("#f4p" + n + "-phone", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.02 + d * 0.06);
        });
      });
      // Label layer arrives behind them, unlit (the pills light on the beat wave below).
      tl.fromTo(".f4-lab", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);

      // ---- Scene 2 (0.5-3.5): the wave - one pill lights per beat, left to right, and at the same instant ----
      // ---- that phone gets one new post: it lands top-left (pop + flash), the grid shifts one slot along. ----
      // Grid pitch from the kit geometry (transform-independent): 356 px grid (380 phone - 2 x 12 inset), 3 columns, 3 px gap.
      const STEP = (356 + 3) / 3;
      for (let n = 1; n <= 7; n++) {
        const b = n * BEAT; // 0.5, 1.0 ... 3.5

        // pill: dim -> lit, small pop, a flare that blooms and fades
        tl.fromTo("#f4-l" + n + "p", { scale: 0.86 }, { scale: 1, duration: 0.5, ease: "power3.out" }, b);
        tl.fromTo("#f4-l" + n + "p", { opacity: 0.32 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, b);
        tl.fromTo("#f4-l" + n + "f", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out" }, b);
        tl.fromTo("#f4-l" + n + "f", { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, b + 0.07);

        // the new post pops in at slot 0 with a white flash
        tl.fromTo("#f4p" + n + "-t0", { scale: 0 }, { scale: 1, duration: 0.5, ease: "expo.out" }, b);
        tl.fromTo("#f4p" + n + "-x", { opacity: 0.85 }, { opacity: 0, duration: 0.55, ease: "power2.out" }, b + 0.06);

        // FLIP: the DOM holds the final grid and each older post starts in the slot it held before. Posts
        // slide one column right; a post leaving the last column hops to the start of the next row
        // (shrinks out in place, grows in at its new slot) so nothing slides diagonally across the grid.
        const tiles = document.querySelectorAll("#f4p" + n + "-grid > .nx-post:not(.f4-fresh)");
        tiles.forEach(function (tile, k) {
          const j = k + 1; // final index (the new post is index 0); before it landed this post sat in slot k
          if (j % 3 !== 0) {
            tl.fromTo(tile, { x: -STEP }, { x: 0, duration: 0.34, ease: "power3.out" }, b);
          } else {
            tl.fromTo(tile, { x: 2 * STEP, y: -STEP, scale: 1 }, { x: 2 * STEP, y: -STEP, scale: 0, duration: 0.15, ease: "power2.in" }, b);
            tl.fromTo(tile, { x: 0, y: 0, scale: 0 }, { x: 0, y: 0, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, b + 0.15);
          }
        });

        // the posts count ticks up by one
        tl.fromTo("#f4p" + n + "-c0", { opacity: 1, y: 0 }, { opacity: 0, y: -9, duration: 0.22, ease: "power2.in" }, b + 0.04);
        tl.fromTo("#f4p" + n + "-c1", { opacity: 0, y: 9 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, b + 0.14);
      }

      // ---- Scene 3 (2.0-3.5): headline under the wall (outside the camera) ----
      // "Built for the businesses" word by word from 2.0 (dynamic-content-sequencing): each word's slot is
      // sized by its length, pre-computed once, and normalised so the last word lands on the 2.5 beat.
      const words = gsap.utils.toArray("#f4-h1 .f4-w");
      const BASE = 0.08, PER_CHAR = 0.03;
      const slots = words.map(function (w) { return BASE + w.textContent.length * PER_CHAR; });
      const lead = slots.slice(0, -1).reduce(function (a, v) { return a + v; }, 0);
      const fit = (2.5 - 2.0) / lead;
      let at = 2.0;
      words.forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at);
        at += slots[i] * fit;
      });

      // "agencies won't call back." lands in the serif at 3.0 ...
      tl.fromTo("#f4-h2in", { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 3.0);
      // ... and a hand-drawn underline draws in beneath it (svg-path-draw, measured length).
      const ul = document.getElementById("f4-ul-path");
      const len = (ul && ul.getTotalLength ? ul.getTotalLength() : 0) || 720;
      gsap.set(ul, { strokeDasharray: len + " " + (len + 20) });
      tl.fromTo(ul, { strokeDashoffset: len + 10 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.28);

      // ---- Scene 4 (3.5-6.0): hold the wall and the headline; no push, no camera move. ----
      // Only the phones buzz: a deterministic micro-jitter (seeded sine hash, nothing random) that grows with the
      // riser + snare roll (film 22-24 s) to ~2.4 px.
      function hash(v) { const s = Math.sin(v * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
      const J1 = 6.0, JSTEP = 1 / 12, SEGS = 28, JAMP = 2.4;
      const J0 = J1 - SEGS * JSTEP; // ~3.67
      for (let n = 1; n <= 7; n++) {
        let px = 0, py = 0;
        for (let s = 1; s <= SEGS; s++) {
          const t = J0 + s * JSTEP;
          const a = JAMP * Math.pow((t - J0) / (J1 - J0), 2);
          const nx = a * (hash(n * 101 + s) * 2 - 1);
          const ny = a * 0.6 * (hash(n * 211 + s + 0.5) * 2 - 1);
          tl.fromTo("#f4p" + n + "-phone", { x: px, y: py }, { x: nx, y: ny, duration: JSTEP, ease: "sine.inOut", immediateRender: false }, t - JSTEP);
          px = nx; py = ny;
        }
      }

      window.__timelines["04-every-business"] = tl;
    })();
  </script>
</template>
