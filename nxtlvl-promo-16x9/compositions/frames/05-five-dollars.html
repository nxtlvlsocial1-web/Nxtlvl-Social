    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Static layout: the wall phones sit at 60% (placed here, not in inline CSS, so no element mixes a CSS transform with GSAP).
      gsap.set("#f5-wall .nx-phone", { scale: 0.6, transformOrigin: "0 0" });

      // t = 0 is the payoff hit (impact SFX). 120 BPM, beat = 0.5 s.

      // Scene 1 (0.0-0.6) - background: the wall dims and pushes back, one finite settle (still by ~1.6 s).
      tl.fromTo("#f5-wall", { scale: 1.05, opacity: 0.5 }, { scale: 1, opacity: 0.32, duration: 1.6, ease: "power3.out" }, 0);
      tl.fromTo("#f5-veil", { opacity: 0.45 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      // Scene 1 - hero: "$5" spring-pops on the hit (scale 0 -> 1, one smooth expo settle, no overshoot; ~98% by 0.35 s).
      tl.fromTo("#f5-five", { scale: 0 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#f5-five", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);

      // Scene 1 - glow bloom behind it: pulse on arrival (peak on the hero's settle), then ease down to a quiet hold.
      tl.fromTo("#f5-bloom", { opacity: 0, scale: 0.55 }, { opacity: 0.45, scale: 1.06, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo("#f5-bloom", { opacity: 0.45, scale: 1.06 }, { opacity: 0.26, scale: 1, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 0.4);

      // Scene 1 - lead line settles down into place above.
      tl.fromTo("#f5-team", { y: -36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.04);

      // Scene 1 - "from" / "a month." slide in toward the $5 from either side at 0.1.
