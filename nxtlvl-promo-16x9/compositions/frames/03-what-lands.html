      <div data-hf-id="hf-0b12" class="nx-serif" id="f3-word" style="position:absolute; left:1200px; top:374px; font-size:132px; line-height:.92; width:660px">the reels.</div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-what-lands"] = tl;

      const DURATION = 8;
      const byId = (id) => document.getElementById(id);
      const feed = byId("f3-feed");
      const word = byId("f3-word");
      const make = byId("f3-make");
      const count = byId("f3-count");

      // ---------- discrete-text-sequence: hard-cut state swaps on the beat ----------
      // Each entry shows from its t until the next entry's t (frame-local seconds).
      const WORDS = [
        { t: 0.0, text: "the reels." },
        { t: 1.0, text: "the posters." },
        { t: 2.0, text: "the carousels." },
        { t: 3.0, text: "the menus." },
        { t: 4.0, text: "the festival drops." },
        { t: 5.0, text: "the captions." },
        { t: 5.5, text: "the ads." },
        { t: 6.0, text: "it too." },
      ];
      const ANCHOR = [
        { t: 0.0, text: "We make" },
        { t: 6.0, text: "We post" },
      ];
      // posts stat ticks quietly as each post lands
      const COUNT = [
        { t: 0.0, text: "9" },
        { t: 4.0, text: "10" },
        { t: 4.5, text: "11" },
        { t: 5.0, text: "12" },
        { t: 6.0, text: "13" },
        { t: 6.5, text: "14" },
        { t: 7.0, text: "15" },
      ];
      function textAt(seq, time) {
        for (let i = seq.length - 1; i >= 0; i--) {
          if (time + 1e-6 >= seq[i].t) return seq[i].text;
        }
        return seq[0].text;
      }

      // ---------- asr-keyword-glow on the tile named by each swap: violet ring + slight lift ----------
      const ATTACK_DUR = 0.12;
      const RELEASE = 0.35;
      const REST_LEVEL = 0.15;
      const MAX_BLUR = 24;
      const MAX_SCALE_BOOST = 0.07;
      const MAX_LIFT = 6;
      const TIMINGS = [
        { el: byId("f3-t1"), start: 0.0, end: 0.85 }, // reels → latte
        { el: byId("f3-t2"), start: 1.0, end: 1.85 }, // posters → diwali
        { el: byId("f3-t4"), start: 2.0, end: 2.85 }, // carousels → salon
        { el: byId("f3-t3"), start: 3.0, end: 3.85 }, // menus → menu
        { el: byId("f3-t8"), start: 4.0, end: 4.85 }, // festival drops → navratri
        { el: byId("f3-t6"), start: 5.0, end: 5.4, inset: true }, // captions → review
        { el: byId("f3-t5"), start: 5.5, end: 5.95 }, // ads → offer
      ];
      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        const releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function paintTile(item, env) {
        const el = item.el;
        if (env <= 0.001) {
          el.style.boxShadow = "";
          el.style.transform = "";
          el.style.zIndex = "";
          return;
        }
        // ring + glow follow the envelope (breadcrumb at rest); the lift settles fully back
        const lift = Math.max(0, (env - REST_LEVEL) / (1 - REST_LEVEL));
        let shadow =
          "0 0 0 3px rgba(169,92,255," + env.toFixed(3) + "), " +
          "0 0 " + (MAX_BLUR * env).toFixed(1) + "px rgba(169,92,255," + (0.6 * env).toFixed(3) + ")";
        if (item.inset) shadow += ", inset 0 0 0 1.5px rgba(169,124,255,.32)";
        el.style.boxShadow = shadow;
        el.style.transform =
          "translateY(" + (-MAX_LIFT * lift).toFixed(2) + "px) scale(" + (1 + MAX_SCALE_BOOST * lift).toFixed(4) + ")";
        el.style.zIndex = lift > 0.01 ? "3" : "1";
      }

      // one linear driver for every discrete swap + the glow envelopes
      function render(time) {
        word.textContent = textAt(WORDS, time);
        make.textContent = textAt(ANCHOR, time);
        count.textContent = textAt(COUNT, time);
        for (let i = 0; i < TIMINGS.length; i++) {
          paintTile(TIMINGS[i], envelope(time, TIMINGS[i].start, TIMINGS[i].end));
        }
      }
      const driver = { t: 0 };
      render(0);
      tl.to(
        driver,
        { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => render(driver.t) },
        0,
      );

      // ---------- viewport-change on the feed: smooth scroll up 170 px to show the new rows ----------
      const cam = { y: 0 };
      function applyCamera() {
        feed.style.transform = "translateY(" + cam.y.toFixed(2) + "px)";
      }
      applyCamera();
      tl.fromTo(
        cam,
        { y: 0 },
        { y: -170, duration: 1.3, ease: "power2.inOut", onUpdate: applyCamera, immediateRender: false },
        4.0,
      );

      // ---------- posts 10–15 land on the beat: scale-pop + white flash ----------
      const LANDS = [
        ["f3-t10", 4.0],
        ["f3-t11", 4.5],
        ["f3-t12", 5.0],
        ["f3-t13", 6.0],
        ["f3-t14", 6.5],
        ["f3-t15", 7.0],
      ];
      LANDS.forEach(([id, at]) => {
        const post = byId(id);
        const flash = post.querySelector(".f3-flash");
        tl.fromTo(post, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, at);
        tl.fromTo(flash, { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, at);
      });

      // ---------- "Posted" toasts slide up inside the phone; each replaces the last ----------
      const TOAST_IN_FROM = { y: 110, autoAlpha: 0 };
      const TOAST_IN_TO = { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" };
      tl.fromTo("#f3-toast1", TOAST_IN_FROM, TOAST_IN_TO, 2.0);
      tl.fromTo("#f3-toast1", { y: 0, autoAlpha: 1 }, { y: -16, autoAlpha: 0, duration: 0.18, ease: "power2.in", immediateRender: false }, 4.0);
      tl.fromTo("#f3-toast2", TOAST_IN_FROM, TOAST_IN_TO, 4.0);
      tl.fromTo("#f3-toast2", { y: 0, autoAlpha: 1 }, { y: -16, autoAlpha: 0, duration: 0.18, ease: "power2.in", immediateRender: false }, 6.0);
      tl.fromTo("#f3-toast3", TOAST_IN_FROM, TOAST_IN_TO, 6.0);
      // toast 3 clears by 7.5 — slides back down out of the screen
      tl.fromTo("#f3-toast3", { y: 0, autoAlpha: 1 }, { y: 110, autoAlpha: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 7.15);

      // ---------- hold 7.0–8.0: subtle jitter on "it too." (anchor stays pinned) ----------
      const CYCLES = 0.6;
      const idle = { p: 0 };
      tl.fromTo(
        idle,
        { p: 0 },
        {
          p: Math.PI * 2 * CYCLES,
          duration: 1.0,
          ease: "none",
          immediateRender: false,
          onUpdate: () => {
            const k = idle.p / (Math.PI * 2 * CYCLES);
            const fade = k < 0.8 ? 1 : (1 - k) / 0.2;
            const y = (Math.sin(idle.p) * 1.6 + Math.sin(idle.p * 2.6) * 0.6) * fade;
            word.style.transform = "translateY(" + y.toFixed(2) + "px)";
          },
        },
        7.0,
      );
    })();
  </script>
