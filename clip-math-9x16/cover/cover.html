<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clip Math cover</title>
    <!-- Cover for the Clip Math reel (1080x1920). All text sits inside the centre 1080x1350 crop (y 285-1635)
         and inside the reel's safe zone (x 130-950, y 250-1500). Render: node build/cover.mjs -->
    <style>
      @font-face { font-family: "Anton"; src: url("../assets/fonts/anton.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("../assets/fonts/montserrat-900.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A0612; }
      body { position: relative; color: #fff; font-family: "Anton", sans-serif; text-transform: uppercase; }
      .bg { position: absolute; inset: 0; background: linear-gradient(180deg, #0A0612 0%, #12082A 38%, #1E0B3C 70%, #2A0F4D 100%); }
      .blob { position: absolute; border-radius: 50%; }
      .b1 { left: -300px; top: -120px; width: 1500px; height: 1500px; background: radial-gradient(circle, rgba(139,92,246,.42) 0%, rgba(139,92,246,.12) 40%, rgba(139,92,246,0) 66%); }
      .b2 { left: 40px; top: 760px; width: 1300px; height: 1300px; background: radial-gradient(circle, rgba(255,61,154,.30) 0%, rgba(255,61,154,.09) 42%, rgba(255,61,154,0) 66%); }
      .b3 { left: -420px; top: 560px; width: 1100px; height: 1100px; background: radial-gradient(circle, rgba(255,138,61,.18) 0%, rgba(255,138,61,.05) 42%, rgba(255,138,61,0) 66%); }
      .floor { position: absolute; left: -540px; width: 2160px; top: 1380px; height: 760px; perspective: 520px; perspective-origin: 50% 0%;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%); opacity: .34; }
      .floor div { position: absolute; left: 0; top: 0; width: 100%; height: 1600px; transform-origin: 50% 0%; transform: rotateX(72deg);
        background-image: linear-gradient(rgba(255,61,154,.9) 2px, transparent 2px), linear-gradient(90deg, rgba(139,92,246,.9) 2px, transparent 2px); background-size: 120px 120px; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 62% at 50% 46%, rgba(0,0,0,0) 55%, rgba(5,2,10,.62) 100%); }
      .grain { position: absolute; inset: 0; background: url("../assets/img/grain.png"); opacity: .09; mix-blend-mode: overlay; }
      .wrap { position: absolute; left: 130px; right: 130px; top: 330px; text-align: center; }
      .chip { display: inline-block; padding: 14px 30px; border-radius: 40px; border: 3px solid #8B5CF6; box-shadow: 0 0 22px rgba(139,92,246,.6);
        font: 900 30px/1 "Montserrat", sans-serif; letter-spacing: .2em; }
      .views { display: block; margin-top: 54px; font-size: 128px; line-height: .95; text-shadow: 0 0 18px rgba(139,92,246,.85), 0 0 54px rgba(139,92,246,.5); }
      .eq { display: block; margin-top: 10px; font-size: 96px; line-height: 1; color: #B9AEDB; }
      .big { display: block; margin-top: 6px; font-size: 400px; line-height: .9; color: #FF3D9A; text-shadow: 0 0 26px rgba(255,61,154,.8), 0 0 90px rgba(255,61,154,.5); }
      .not { display: block; margin-top: 40px; font-size: 120px; line-height: 1; }
      .not s { position: relative; text-decoration: none; display: inline-block; opacity: .7; }
      .not s::after { content: ""; position: absolute; left: -4%; width: 108%; top: 46%; height: 16px; border-radius: 8px; background: #FF2D46;
        transform: rotate(-7deg); box-shadow: 0 0 16px rgba(255,45,70,.9), 0 0 44px rgba(255,45,70,.6); }
      .prog { position: absolute; left: 40px; right: 40px; top: 34px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); }
    </style>
  </head>
  <body>
    <div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="floor"><div></div></div><div class="vig"></div>
    <div class="wrap">
      <span class="chip">The math nobody shows you</span>
      <span class="views">1,000,000 views</span>
      <span class="eq">=</span>
      <span class="big">$225</span>
      <span class="not">Not <s>$1,000</s></span>
    </div>
    <div class="grain"></div>
  </body>
</html>
