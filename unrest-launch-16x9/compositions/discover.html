<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Unrest · discover</title></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
        @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("../assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #disc-bg { position: absolute; inset: 0; background: #ffffff; }
        #disc-cam, #disc-punch, #disc-stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #disc-stage { font-family: "Space Grotesk", sans-serif; color: #000000; }
        .disc-meta { position: absolute; display: block; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }
        #disc-meta-tl { left: 96px; top: 80px; } #disc-meta-tr { right: 96px; top: 80px; } #disc-meta-br { right: 96px; bottom: 64px; }
        .disc-row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
        #disc-word { top: 138px; }
        #disc-title { display: block; font-weight: 700; font-size: 232px; letter-spacing: -0.045em; line-height: 0.86; text-transform: uppercase; white-space: nowrap; color: #000000; -webkit-text-stroke: 5px #000000; }
        .ch { display: inline-block; transform-origin: 50% 100%; }
        .ci { display: inline-block; transform-origin: 50% 100%; opacity: 0; }
        #disc-kicker { top: 368px; }
        #disc-kick { display: block; font-weight: 500; font-size: 30px; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; opacity: 0; }
        /* phone: flat black body, white screen, scrolling feed */
        #disc-phone { position: absolute; left: 770px; top: 440px; width: 380px; height: 780px; border-radius: 60px; background: #000000; }
        #disc-screen { position: absolute; left: 16px; top: 16px; right: 16px; bottom: 16px; border-radius: 46px; background: #ffffff; overflow: hidden; }
        #disc-notch { position: absolute; left: 124px; top: 14px; width: 100px; height: 26px; border-radius: 13px; background: #000000; }
        #disc-feed { position: absolute; left: 22px; right: 22px; top: 64px; }
        .disc-card { position: relative; height: 148px; margin-bottom: 18px; border: 4px solid #000000; border-radius: 22px; }
        .disc-card .av { position: absolute; left: 16px; top: 16px; width: 34px; height: 34px; border-radius: 50%; background: #000000; }
        .disc-card .l1 { position: absolute; left: 62px; top: 20px; width: 120px; height: 10px; border-radius: 5px; background: #000000; }
        .disc-card .l2 { position: absolute; left: 62px; top: 38px; width: 70px; height: 8px; border-radius: 4px; background: #000000; }
        .disc-card .blk { position: absolute; left: 16px; right: 16px; top: 66px; height: 58px; border-radius: 12px; background: #000000; }
        .disc-card .bar { position: absolute; left: 16px; top: 70px; height: 12px; border-radius: 6px; background: #000000; }
        /* icons fly out of the phone and land in four slots */
        .disc-slot { position: absolute; width: 170px; height: 170px; transform-origin: 50% 50%; }
        .disc-bob, .disc-pop { position: absolute; inset: 0; transform-origin: 50% 50%; }
        .disc-pop { opacity: 0; }
        .disc-pop svg { display: block; width: 100%; height: 100%; overflow: visible; }
        .disc-pop .ln { fill: none; stroke: #000000; stroke-width: 4.5; stroke-linecap: square; }
        .disc-pop .fill { fill: #000000; }
        .disc-lab { position: absolute; left: -65px; top: 184px; width: 300px; display: flex; justify-content: center; opacity: 0; }
        .disc-lab span { display: block; font-weight: 500; font-size: 28px; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }
        .disc-fly { position: absolute; left: 940px; top: 700px; width: 40px; height: 40px; border-radius: 50%; background: #000000; opacity: 0; }
      </style>
      <div data-hf-id="hf-7swg" id="root" data-composition-id="discover" data-width="1920" data-height="1080">
        <div data-hf-id="hf-tasm" id="disc-bg"></div>
        <div data-hf-id="hf-szpk" id="disc-cam"><div data-hf-id="hf-erdh" id="disc-punch"><div data-hf-id="hf-tfkb" id="disc-stage">
          <span data-hf-id="hf-paio" class="disc-meta" id="disc-meta-tl">01 — Discover</span>
          <span data-hf-id="hf-0lq7" class="disc-meta" id="disc-meta-tr">Unrest / DU</span>
          <span data-hf-id="hf-psuh" class="disc-meta" id="disc-meta-br">unrestdu.in</span>
          <div data-hf-id="hf-weze" id="disc-word" class="disc-row"><span data-hf-id="hf-udqb" id="disc-title">Discover.</span></div>
          <div data-hf-id="hf-snwx" id="disc-kicker" class="disc-row"><span data-hf-id="hf-jpeb" id="disc-kick">What's happening on campus?</span></div>
          <div data-hf-id="hf-5pcx" id="disc-phone"><div data-hf-id="hf-peov" id="disc-screen"><div data-hf-id="hf-89xz" id="disc-notch"></div><div data-hf-id="hf-enpv" id="disc-feed"></div></div></div>
          <div data-hf-id="hf-907q" id="disc-slots"></div>
        </div></div></div>
      </div>
      <script>
        (() => {
          const F = 1 / 30;
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const show = (el, t) => tl.set(el, { opacity: 1 }, t);
          const hide = (el, t) => tl.set(el, { opacity: 0 }, t);
          function shake(el, t, amp = 1) {
            [[14, -7], [-10, 8], [6, -4], [-3, 2], [0, 0]].forEach(([x, y], i) => tl.set(el, { x: x * amp, y: y * amp }, t + i * F));
          }
          function spring(response, z) {
            const w = (2 * Math.PI) / response, wd = w * Math.sqrt(1 - z * z);
            const pos = (t) => 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
            const T = Math.log(1000) / (z * w), xT = pos(T);
            return { duration: T, ease: (p) => pos(p * T) + p * (1 - xT) };
          }
          function split(el) {
            const txt = el.textContent; el.textContent = "";
            return [...txt].map((c) => {
              const o = document.createElement("span"), i = document.createElement("span");
              o.className = "ch"; i.className = "ci"; i.textContent = c === " " ? " " : c;
              o.appendChild(i); el.appendChild(o); return { o, i };
            });
          }
          const BOUNCY = spring(0.36, 0.58), POP = spring(0.3, 0.62), LAND = spring(0.5, 0.7);

          // feed cards inside the phone
          for (let k = 0; k < 7; k++) {
            const c = document.createElement("div");
            c.className = "disc-card";
            c.innerHTML = '<div class="av"></div><div class="l1"></div><div class="l2"></div>' +
              (k % 3 === 1 ? '<div class="bar" style="width:200px"></div><div class="bar" style="width:130px;top:92px"></div><div class="bar" style="width:170px;top:114px"></div>' : '<div class="blk"></div>');
            $("#disc-feed").appendChild(c);
          }

          const ICONS = {
            feed: '<rect class="ln" x="14" y="16" width="92" height="88" rx="10"/><circle class="fill" cx="33" cy="35" r="9"/><path class="ln" d="M50 30 H90 M50 41 H74 M26 60 H94 M26 74 H94 M26 88 H64"/>',
            poll: '<path class="ln" d="M18 14 H102 V82 H52 L30 104 L34 82 H18 Z"/><rect class="fill" x="30" y="28" width="56" height="10" rx="5"/><rect class="fill" x="30" y="44" width="34" height="10" rx="5"/><rect class="fill" x="30" y="60" width="46" height="10" rx="5"/>',
            ticket: '<path class="ln" d="M10 30 H110 V50 A10 10 0 0 0 110 70 V90 H10 V70 A10 10 0 0 0 10 50 Z"/><path class="ln" d="M82 36 V84" stroke-dasharray="6 6"/><path class="fill" d="M46 40 L50 52 L62 52 L52 59 L56 71 L46 63 L36 71 L40 59 L30 52 L42 52 Z"/>',
            pin: '<path class="ln" d="M60 108 C60 108 24 70 24 46 A36 36 0 0 1 96 46 C96 70 60 108 60 108 Z"/><circle class="fill" cx="60" cy="46" r="13"/>',
          };
          const SLOTS = [
            ["feed", "Feed", 470, 560], ["poll", "Polls", 390, 822],
            ["ticket", "Fests", 1450, 560], ["pin", "Spots", 1530, 822],
          ];
          const slots = SLOTS.map(([k, label, cx, cy], n) => {
            const s = document.createElement("div");
            s.className = "disc-slot"; s.id = "disc-slot-" + k;
            s.style.left = cx - 85 + "px"; s.style.top = cy - 85 + "px";
            s.innerHTML = `<div class="disc-bob" id="disc-bob-${k}"><div class="disc-pop" id="disc-pop-${k}"><svg viewBox="0 0 120 120">${ICONS[k]}</svg></div>` +
              `<div class="disc-lab" id="disc-lab-${k}"><span>${label}</span></div></div>`;
            $("#disc-slots").appendChild(s);
            const f = document.createElement("div");
            f.className = "disc-fly"; f.id = "disc-fly-" + k;
            $("#disc-slots").appendChild(f);
            return { k, cx, cy, n };
          });

          // camera: slow push, a soft punch on every beat
          tl.fromTo("#disc-cam", { scale: 1 }, { scale: 1.05, duration: 3, ease: "sine.inOut" }, 0);
          [0, 0.5, 1.0, 1.5, 2.0].forEach((b) => tl.fromTo("#disc-punch", { scale: b === 2.0 ? 1.05 : 1.025 }, { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, b));

          // DISCOVER. cascades in letter by letter with a springy landing
          const title = split($("#disc-title"));
          title.forEach(({ i }, k) => {
            const t = k * 0.03;
            show(i, t);
            tl.fromTo(i, { y: -220, rotation: k % 2 ? 10 : -10, scaleY: 1.35, scaleX: 0.8 }, { y: 0, rotation: 0, scaleY: 1, scaleX: 1, duration: BOUNCY.duration, ease: BOUNCY.ease }, t);
          });
          show("#disc-kick", 0.35);
          tl.fromTo("#disc-kick", { y: 30 }, { y: 0, duration: POP.duration, ease: POP.ease }, 0.35);

          // the phone springs up from below and its feed scrolls
          tl.fromTo("#disc-phone", { y: 700, rotation: -6 }, { y: 0, rotation: 0, duration: LAND.duration, ease: LAND.ease }, 0.08);
          tl.fromTo("#disc-feed", { y: 0 }, { y: -560, duration: 2.6, ease: "power1.inOut" }, 0.2);

          // each discovery leaves the phone as a dot and bursts into its icon (8th-note succession)
          slots.forEach(({ k, cx, cy, n }) => {
            const t = 0.5 + n * 0.25, land = t + 0.24;
            const fly = "#disc-fly-" + k;
            show(fly, t);
            tl.fromTo(fly, { x: 0, scale: 0.4 }, { x: cx - 960, scale: 1, duration: 0.24, ease: "power2.out" }, t);
            tl.fromTo(fly, { y: 0 }, { y: cy - 720, duration: 0.24, ease: "back.out(1.6)" }, t);
            hide(fly, land);
            show("#disc-pop-" + k, land);
            tl.fromTo("#disc-pop-" + k, { scale: 0.2, rotation: n % 2 ? 25 : -25 }, { scale: 1, rotation: 0, duration: BOUNCY.duration, ease: BOUNCY.ease }, land);
            show("#disc-lab-" + k, land + 0.06);
            tl.fromTo("#disc-lab-" + k, { y: 24 }, { y: 0, duration: POP.duration, ease: POP.ease }, land + 0.06);
            // gentle float after landing (finite yoyo, ends before the exit)
            const reps = Math.max(0, Math.floor((2.7 - (land + 0.3)) / 0.45) - 1);
            tl.fromTo("#disc-bob-" + k, { y: 0 }, { y: n % 2 ? 12 : -12, duration: 0.45, ease: "sine.inOut", repeat: reps, yoyo: true }, land + 0.3);
          });

          // bar downbeat: the word flips to outline in a wave and every icon kicks
          title.forEach(({ i }, k) => tl.set(i, { color: "#ffffff" }, 2.0 + k * 0.03));
          slots.forEach(({ k, n }) => tl.fromTo("#disc-slot-" + k, { scale: 1.22 }, { scale: 1, duration: POP.duration, ease: POP.ease, immediateRender: false }, 2.0 + n * 0.04));
          shake("#disc-stage", 2.0, 0.7);
          // a bouncing hop rolls across the letters
          title.forEach(({ i }, k) => {
            const t = 2.45 + k * 0.02;
            tl.to(i, { y: -38, duration: 0.11, ease: "power2.out" }, t);
            tl.to(i, { y: 0, duration: 0.26, ease: "bounce.out" }, t + 0.11);
          });

          // exit: everything launches upward as the black panel pushes in from below
          title.forEach(({ o }, k) => tl.fromTo(o, { y: 0 }, { y: -460, duration: 0.22, ease: "power3.in", immediateRender: false }, 2.72 + k * 0.012));
          tl.to("#disc-phone", { y: -1300, duration: 0.28, ease: "power3.in" }, 2.72);
          slots.forEach(({ k }) => tl.to("#disc-slot-" + k, { scale: 0, duration: 0.2, ease: "power3.in" }, 2.74));
          tl.to("#disc-kick", { y: -300, duration: 0.24, ease: "power3.in" }, 2.72);

          window.__timelines["discover"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
