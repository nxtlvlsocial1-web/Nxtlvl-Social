      <style>

        @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("../assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }

        #exp-outline { position: absolute; left: 0; top: 0; color: #000000; -webkit-text-stroke: 5px #ffffff; opacity: 0; }

        #exp-ticket .t2 { position: absolute; left: 72px; top: 124px; display: block; font-weight: 500; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; color: #000000; white-space: nowrap; }
      </style>
      <div data-hf-id="hf-51ff" id="root" data-composition-id="experience" data-width="1920" data-height="1080">
        <div data-hf-id="hf-50dq" id="exp-bg"></div>
        <div data-hf-id="hf-gn7n" id="exp-stage">
          <span data-hf-id="hf-sl5v" class="exp-meta" id="exp-meta-tl">03 — Experience</span>
          <span data-hf-id="hf-lljl" class="exp-meta" id="exp-meta-tr">Unrest / DU</span>
          <svg data-hf-id="hf-9k1o" id="exp-burst" viewBox="0 0 1920 1080"></svg>
          <svg data-hf-id="hf-m66h" id="exp-art" viewBox="0 0 1920 1080">

              <rect data-hf-id="hf-5qpl" class="ln" x="560" y="150" width="800" height="44" pathLength="1" />
              <path data-hf-id="hf-xr08" class="ln" pathLength="1" d="M560 194 L600 150 L640 194 L680 150 L720 194 L760 150 L800 194 L840 150 L880 194 L920 150 L960 194 L1000 150 L1040 194 L1080 150 L1120 194 L1160 150 L1200 194 L1240 150 L1280 194 L1320 150 L1360 194" />
            </g>
            <g data-hf-id="hf-nhvk" id="exp-beam-l" class="exp-later"><path data-hf-id="hf-jrb8" class="beam" d="M720 194 L620 560 M720 194 L800 560" /></g>
            <g data-hf-id="hf-lyg6" id="exp-beam-r" class="exp-later"><path data-hf-id="hf-3sew" class="beam" d="M1200 194 L1120 560 M1200 194 L1300 560" /></g>
            <g data-hf-id="hf-y4ds" id="exp-platform">
              <path data-hf-id="hf-hv9a" class="fill" d="M560 580 H1360 L1420 630 H500 Z" />
              <rect data-hf-id="hf-uh4h" class="fill" x="420" y="420" width="110" height="210" />
              <rect data-hf-id="hf-9ipe" class="fill" x="1390" y="420" width="110" height="210" />
              <circle data-hf-id="hf-vo1g" class="cone" cx="475" cy="480" r="26" /><circle data-hf-id="hf-2d08" class="cone" cx="475" cy="568" r="34" />
              <circle data-hf-id="hf-8na6" class="cone" cx="1445" cy="480" r="26" /><circle data-hf-id="hf-w2gi" class="cone" cx="1445" cy="568" r="34" />
            </g>
          </svg>
          <div data-hf-id="hf-zho2" id="exp-word" class="exp-row">
            <span data-hf-id="hf-krfk" id="exp-stack">
              <span data-hf-id="hf-fgda" class="exp-word" id="exp-solid">Experience.</span>
              <span data-hf-id="hf-39nb" class="exp-word" id="exp-outline">Experience.</span>
            </span>
          </div>
          <div data-hf-id="hf-jbue" id="exp-crowd"></div>
          <div data-hf-id="hf-rj4v" id="exp-ticket" data-layout-allow-overlap>
            <svg data-hf-id="hf-cq3v" viewBox="0 0 500 230"><path data-hf-id="hf-uui9" d="M0 0 H500 V88 A27 27 0 0 0 500 142 V230 H0 V142 A27 27 0 0 0 0 88 Z" fill="#ffffff" />
              <line data-hf-id="hf-wur3" x1="420" y1="18" x2="420" y2="212" stroke="#000000" stroke-width="4" stroke-dasharray="12 10" /></svg>
            <span data-hf-id="hf-y081" class="t1">Unrest House</span>
            <span data-hf-id="hf-wvl4" class="t2">Admit one · Invite only</span>

      </div>
      <script>
        (() => {
          const F = 1 / 30;
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const NS = "http://www.w3.org/2000/svg";
          const show = (el, t) => tl.set(el, { opacity: 1 }, t);
          const hide = (el, t) => tl.set(el, { opacity: 0 }, t);
          function shake(el, t, amp = 1) {
            [[14, -7], [-10, 8], [6, -4], [-3, 2], [0, 0]].forEach(([x, y], i) => tl.set(el, { x: x * amp, y: y * amp }, t + i * F));
          }
          function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
          const rand = mulberry32(8080);

          // dots drop in as heads, bodies rise: a crowd of 15
          for (let i = 0; i < 15; i++) {
            const p = document.createElement("div");
            p.className = "exp-person"; p.id = "exp-person-" + i;
            p.style.left = 70 + i * 122 + (rand() - 0.5) * 30 + "px";
            let arms = "";
            if (i % 3 === 1) arms += '<div class="arm" style="left:4px;transform:rotate(-24deg)"></div>';
            if (i % 4 === 2) arms += '<div class="arm" style="left:104px;transform:rotate(22deg)"></div>';
            p.innerHTML = arms + '<div class="body"></div><div class="head"></div>';
            $("#exp-crowd").appendChild(p);
            const s = 0.82 + rand() * 0.3, t = Math.abs(i - 7) * 0.02;
            tl.fromTo(p, { y: 220, scale: s }, { y: 0, scale: s, duration: 0.34, ease: "expo.out" }, t);
            tl.fromTo(p.querySelector(".head"), { scale: 0.3, y: -60 }, { scale: 1, y: 0, duration: 0.3, ease: "back.out(2.5)" }, t);
            // the crowd jumps on alternate beats
            [0.5, 1.0, 1.5, 2.0, 2.5].forEach((b, k) => {
              if ((i + k) % 2 === 0) tl.fromTo(p, { y: -26 }, { y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, b);
            });
          }

          // the fest stage builds: truss draws, platform rises, beams sweep
          tl.fromTo("#exp-truss .ln", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.04 }, 0.1);
          tl.fromTo("#exp-platform", { scaleY: 0, svgOrigin: "960 630" }, { scaleY: 1, svgOrigin: "960 630", duration: 0.32, ease: "back.out(1.8)" }, 0.2);
          show("#exp-beam-l", 0.5); show("#exp-beam-r", 0.5);
          // beams sweep side to side on every beat (finite yoyo, ends with the scene)
          tl.fromTo("#exp-beam-l", { rotation: -14, svgOrigin: "720 194" }, { rotation: 12, svgOrigin: "720 194", duration: 0.5, ease: "power2.inOut", repeat: 4, yoyo: true }, 0.5);
          tl.fromTo("#exp-beam-r", { rotation: 14, svgOrigin: "1200 194" }, { rotation: -12, svgOrigin: "1200 194", duration: 0.5, ease: "power2.inOut", repeat: 4, yoyo: true }, 0.5);

          // burst: geometric shapes fire up and out of the stage (the root inverts the frame here)
          const kinds = ["circle", "square", "tri", "ring", "plus"];
          for (let i = 0; i < 26; i++) {
            const k = kinds[i % 5], sz = 20 + rand() * 46;
            const a = -Math.PI - 0.25 + (i / 25) * (Math.PI + 0.5) + (rand() - 0.5) * 0.2;
            const dist = 480 + rand() * 520, tx = 960 + Math.cos(a) * dist, ty = 380 + Math.sin(a) * dist * 0.62;
            let el;
            if (k === "circle" || k === "ring") { el = document.createElementNS(NS, "circle"); el.setAttribute("r", sz / 2); el.setAttribute("cx", 0); el.setAttribute("cy", 0); }
            else if (k === "square") { el = document.createElementNS(NS, "rect"); el.setAttribute("x", -sz / 2); el.setAttribute("y", -sz / 2); el.setAttribute("width", sz); el.setAttribute("height", sz); }
            else if (k === "tri") { el = document.createElementNS(NS, "path"); el.setAttribute("d", `M0 ${-sz / 1.7} L${sz / 2} ${sz / 2.9} L${-sz / 2} ${sz / 2.9} Z`); }
            else { el = document.createElementNS(NS, "path"); el.setAttribute("d", `M${-sz / 2} -5 H${sz / 2} V5 H${-sz / 2} Z M-5 ${-sz / 2} H5 V${sz / 2} H-5 Z`); }
            el.setAttribute("class", k === "ring" ? "o" : "s");
            el.setAttribute("id", "exp-shape-" + i);
            el.setAttribute("opacity", "0");
            $("#exp-burst").appendChild(el);
            const spin = (rand() - 0.5) * 300;
            tl.set(el, { attr: { opacity: 1 } }, 1.0);
            tl.fromTo(el, { x: 960, y: 380, scale: 0.2, rotation: 0 }, { x: tx, y: ty, scale: 1, rotation: spin, duration: 0.7, ease: "expo.out" }, 1.0);
            tl.to(el, { x: tx + (tx - 960) * 0.14, y: ty + (ty - 380) * 0.14, rotation: spin * 1.3, duration: 1.25, ease: "none" }, 1.7);
          }
          shake("#exp-stage", 1.0, 1.3);
          show("#exp-word", 1.0);
          tl.fromTo("#exp-stack", { scale: 1.45 }, { scale: 1, duration: 0.3, ease: "expo.out" }, 1.0);

          // Unrest House ticket stamps in
          show("#exp-ticket", 1.86);
          tl.fromTo("#exp-ticket", { scale: 2.3, rotation: -22 }, { scale: 1, rotation: -9, duration: 0.14, ease: "power4.in" }, 1.86);
          shake("#exp-stage", 2.0, 1.1);
          show("#exp-outline", 2.5); hide("#exp-solid", 2.5);

          window.__timelines["experience"] = tl;
        })();
      </script>
