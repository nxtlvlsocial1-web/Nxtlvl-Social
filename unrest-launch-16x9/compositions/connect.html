      <script>
        (() => {
          const F = 1 / 30;
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const NS = "http://www.w3.org/2000/svg";
          const show = (el, t) => tl.set(el, { opacity: 1 }, t);
          const hide = (el, t) => tl.set(el, { opacity: 0 }, t);
          function shake(el, t, amp = 1) {
            [[14, -7], [-10, 8], [6, -4], [-3, 2], [0, 0]].forEach(([x, y], i) => tl.set(el, { x: x * amp, y: y * amp }, t + i * F));
          }
          function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
          const rand = mulberry32(20261017);

          // seeded scatter of 36 dots, each joined to its two nearest neighbours
          const pts = [];
          let guard = 0;
          while (pts.length < 36 && guard++ < 4000) {
            const p = { x: 150 + rand() * 1620, y: 150 + rand() * 790 };
            if (pts.every((q) => Math.hypot(q.x - p.x, q.y - p.y) > 150)) pts.push(p);
          }
          const edges = new Map();
          pts.forEach((p, i) => {
            pts.map((q, j) => ({ j, d: Math.hypot(q.x - p.x, q.y - p.y) })).filter((o) => o.j !== i)
              .sort((a, b) => a.d - b.d).slice(0, 2)
              .forEach((o) => edges.set(Math.min(i, o.j) + "-" + Math.max(i, o.j), [i, o.j]));
          });
          const edgeList = [...edges.values()].sort((a, b) => (pts[a[0]].x + pts[a[1]].x) - (pts[b[0]].x + pts[b[1]].x));
          edgeList.forEach(([i, j], n) => {
            const l = document.createElementNS(NS, "line");
            l.setAttribute("x1", pts[i].x); l.setAttribute("y1", pts[i].y);
            l.setAttribute("x2", pts[j].x); l.setAttribute("y2", pts[j].y);
            l.setAttribute("pathLength", "1"); l.setAttribute("stroke-dashoffset", "1");
            l.id = "con-edge-" + n;
            $("#con-net-lines").appendChild(l);
          });
          pts.forEach((p, i) => {
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", i % 5 === 0 ? 12 : 7);
            c.id = "con-dot-" + i;
            $("#con-net-dots").appendChild(c);
          });

          shake("#con-stage", 0, 0.6);
          tl.fromTo("#con-rule", { scaleX: 0 }, { scaleX: 1, duration: 2.95, ease: "none" }, 0);
          pts.map((p, i) => ({ i, d: Math.hypot(p.x - 960, p.y - 540) })).sort((a, b) => a.d - b.d).forEach(({ i }, n) => {
            const o = pts[i].x + " " + pts[i].y;
            tl.fromTo("#con-dot-" + i, { scale: 0, svgOrigin: o }, { scale: 1, svgOrigin: o, duration: 0.22, ease: "back.out(3)" }, n * 0.009);
          });
          edgeList.forEach((_, n) => {
            tl.fromTo("#con-edge-" + n, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.14, ease: "power1.out" }, 0.26 + (n / edgeList.length) * 0.62);
          });

          // the network collapses into the spot where two people meet
          tl.fromTo("#con-net-g", { scale: 1, rotation: 0, svgOrigin: "960 330" }, { scale: 0, rotation: 24, svgOrigin: "960 330", duration: 0.24, ease: "power3.in", immediateRender: false }, 0.98);
          show("#con-bub-l", 1.12); show("#con-bub-r", 1.12);
          tl.fromTo("#con-bub-l", { x: -900, rotation: -10 }, { x: 0, rotation: 0, duration: 0.2, ease: "back.out(1.6)" }, 1.12);
          tl.fromTo("#con-bub-r", { x: 900, rotation: 10 }, { x: 0, rotation: 0, duration: 0.2, ease: "back.out(1.6)" }, 1.14);
          tl.fromTo(["#con-bub-l", "#con-bub-r"], { scale: 1.14 }, { scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, 1.32);

          // Corridor doors slam shut, then slide open on CONNECT.
          show("#con-door-l", 1.38); show("#con-door-r", 1.38);
          tl.fromTo("#con-door-l", { x: -960 }, { x: 0, duration: 0.12, ease: "power4.in" }, 1.38);
          tl.fromTo("#con-door-r", { x: 960 }, { x: 0, duration: 0.12, ease: "power4.in" }, 1.38);
          shake("#con-stage", 1.5, 0.9);
          show("#con-word", 1.75);
          tl.to("#con-door-l", { x: -980, duration: 0.42, ease: "expo.out" }, 1.75);
          tl.to("#con-door-r", { x: 980, duration: 0.42, ease: "expo.out" }, 1.75);
          tl.fromTo("#con-stack", { scale: 0.86 }, { scale: 1, duration: 0.45, ease: "expo.out" }, 1.75);
          show("#con-under", 2.0);
          tl.fromTo("#con-under", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 2.0);
          show("#con-kick", 2.0);
          tl.fromTo("#con-kick", { y: 18 }, { y: 0, duration: 0.25, ease: "expo.out" }, 2.0);
          show("#con-outline", 2.5); hide("#con-solid", 2.5);

          window.__timelines["connect"] = tl;
        })();
