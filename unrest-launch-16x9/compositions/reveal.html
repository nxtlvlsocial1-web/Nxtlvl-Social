      <script>
        (() => {
          const F = 1 / 30;
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const show = (el, t) => tl.set(el, { opacity: 1 }, t);
          const hide = (el, t) => tl.set(el, { opacity: 0 }, t);
          function shake(el, t, amp = 1) {
            [[14, -7], [-10, 8], [6, -4], [-3, 2], [0, 0]].forEach(([x, y], i) => tl.set(el, { x: x * amp, y: y * amp }, t + i * F));
          }
          function spring(response, z) {
            const w = (2 * Math.PI) / response, wd = w * Math.sqrt(1 - z * z);
            const pos = (t) => 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
            const T = Math.log(1000) / (z * w), xT = pos(T);
            return { duration: T, ease: (p) => pos(p * T) + p * (1 - xT) };
          }
          const RISE = spring(0.42, 0.62), POP = spring(0.3, 0.65), WOBBLE = spring(0.34, 0.5), LINE = spring(0.36, 0.8);

          // slow push-in through the whole hold
          tl.fromTo("#rev-cam", { scale: 1 }, { scale: 1.045, duration: 2, ease: "sine.inOut" }, 0);

          // impact: the dot fires a triple shockwave, condenses, and shoots out into a baseline
          shake("#rev-stage", 0, 1.0);
          [["#rev-ring", 0, 3.4], ["#rev-ring2", 0.06, 2.6], ["#rev-ring3", 0.12, 1.9]].forEach(([r, d, s]) => {
            show(r, d);
            tl.fromTo(r, { scale: 0.05 }, { scale: s, duration: 0.55, ease: "expo.out" }, d);
            hide(r, d + 0.55);
          });
          tl.fromTo("#rev-dot", { scale: 1 }, { scale: 2.2, duration: 0.1, ease: "expo.out" }, 0);
          tl.to("#rev-dot", { scale: 0.27, y: 64, duration: 0.12, ease: "power3.in" }, 0.1);
          hide("#rev-dot", 0.22);
          show("#rev-line", 0.22);
          tl.fromTo("#rev-line", { scaleX: 0.01 }, { scaleX: 1, duration: LINE.duration, ease: LINE.ease }, 0.22);

          // the wordmark's letters spring up out of the baseline, left to right
          [...document.querySelectorAll("#rev-svg .rev-l")].forEach((l, k) => {
            tl.fromTo(l, { y: 150 }, { y: 0, duration: RISE.duration, ease: RISE.ease }, 0.3 + k * 0.045);
          });
          tl.to("#rev-line", { scaleX: 0, duration: 0.18, ease: "power3.in" }, 0.72);
          hide("#rev-line", 0.9);

          // tagline types in with a tiny pop per character
          [..."Your Campus. Your Network."].forEach((ch, k) => {
            const s = document.createElement("span");
            s.textContent = ch === " " ? " " : ch;
            $("#rev-tagline").appendChild(s);
            const t = 0.42 + k * 0.018;
            show(s, t);
            tl.fromTo(s, { y: 22 }, { y: 0, duration: POP.duration, ease: POP.ease }, t);
          });
          // handles spring up and hold for 1.5 s
          show("#rev-urltext", 0.5);
          tl.fromTo("#rev-urltext", { y: 40 }, { y: 0, duration: POP.duration, ease: POP.ease }, 0.5);

          // one confident pulse on the beat, then hold
          tl.fromTo("#rev-logo", { scale: 1.08 }, { scale: 1, duration: WOBBLE.duration, ease: WOBBLE.ease, immediateRender: false }, 1.5);
          show("#rev-ring2", 1.5);
          tl.fromTo("#rev-ring2", { scale: 0.6 }, { scale: 2.6, duration: 0.45, ease: "expo.out", immediateRender: false }, 1.5);
          hide("#rev-ring2", 1.95);

          window.__timelines["reveal"] = tl;
        })();
