    <script type="module">
      import { WORDS } from "./src/captions-data.js";
      const holder = document.getElementById("captions");
      const tl = gsap.timeline({ paused: true });
      WORDS.forEach((w, i) => {
        const el = document.createElement("div");
        el.className = "w";
        el.textContent = w.w;
        holder.appendChild(el);
        tl.set(el, { opacity: 1, scale: 0.84 }, w.s);
        tl.to(el, { scale: 1, duration: 0.09, ease: "power2.out" }, w.s);
        tl.set(el, { opacity: 0 }, Math.min(w.off, 43.54));
      });
      tl.fromTo("#end-big", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 43.65);
      tl.fromTo("#end-btn", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 43.9);
      tl.to("#end-btn", { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 45.4);
      window.__timelines["main"] = tl;
      if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
    </script>
