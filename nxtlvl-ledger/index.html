<style>
/* Layout: brand-ink sidebar (the logo's ground) beside a calm lavender-neutral workspace; numbers in wide Archivo. */
:root {
  --bg: #F5F3FA; --surface: #FFFFFF; --surface-2: #F1EDF9; --ink: #140E24; --muted: #6B6391; --line: #E4DEF0;
  --accent: #7D18FC; --accent-ink: #FFFFFF; --accent-soft: #EFE4FF; --accent-text: #6A12D6;
  --good: #0E7F57; --good-soft: #E1F4EB; --warn: #9A6200; --warn-soft: #FFF2D6; --bad: #C4314B; --bad-soft: #FCE6EA;
  --bar-a: #7D18FC; --bar-b: #C9BCE6; --grid: #ECE7F5;
  --side: #0A0620; --side-2: #140C33; --side-ink: #F1EBFF; --side-muted: #9D93C7; --side-line: #241A45;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --r: 12px; --shadow: 0 1px 2px rgba(20,14,36,.05), 0 8px 24px -12px rgba(20,14,36,.12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07050E; --surface: #110C1E; --surface-2: #181128; --ink: #F1ECFF; --muted: #A49BC6; --line: #261D3D;
  --accent: #A95CFF; --accent-ink: #0A0620; --accent-soft: #261546; --accent-text: #C79BFF;
  --good: #3CD493; --good-soft: #0E2A20; --warn: #F2B54A; --warn-soft: #2C2212; --bad: #FF6E87; --bad-soft: #33151F;
  --bar-a: #A95CFF; --bar-b: #463A68; --grid: #1D1630;
  --side: #05030C; --side-2: #0F0A24; --side-line: #1E1636;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07050E; --surface: #110C1E; --surface-2: #181128; --ink: #F1ECFF; --muted: #A49BC6; --line: #261D3D;
  --accent: #A95CFF; --accent-ink: #0A0620; --accent-soft: #261546; --accent-text: #C79BFF;
  --good: #3CD493; --good-soft: #0E2A20; --warn: #F2B54A; --warn-soft: #2C2212; --bad: #FF6E87; --bad-soft: #33151F;
  --bar-a: #A95CFF; --bar-b: #463A68; --grid: #1D1630;
  --side: #05030C; --side-2: #0F0A24; --side-line: #1E1636;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.r, .kpi b { font-variant-numeric: tabular-nums; }

/* shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: radial-gradient(420px 360px at 0% 0%, rgba(126,26,246,.42), rgba(126,26,246,0)), var(--side); color: var(--side-ink);
  padding-block: 20px; padding-inline: 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--side-line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brand .wm { font-family: var(--f-display); font-weight: 800; font-stretch: 112%; letter-spacing: -.03em; font-size: 21px; line-height: 1; }
.brand .wm span { font-family: var(--f-body); font-weight: 400; color: #D8BBFF; letter-spacing: 0; font-stretch: 100%; margin-left: 3px; }
.brand small { display: block; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--side-muted); margin-top: 5px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; color: var(--side-muted); font-weight: 500; }
.nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button:hover { color: var(--side-ink); background: rgba(255,255,255,.04); }
.nav button[aria-current="page"] { color: #fff; background: linear-gradient(90deg, rgba(169,92,255,.28), rgba(169,92,255,.08)); }
.nav button:focus-visible { outline: 2px solid #A95CFF; }
.nav .count { margin-left: auto; font-size: 11.5px; background: rgba(255,92,122,.18); color: #FF9FB1; padding: 1px 7px; border-radius: 99px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--side-muted); padding: 0 6px; display: grid; gap: 6px; }
.sync { display: flex; align-items: center; gap: 7px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: #3CD493; box-shadow: 0 0 0 3px rgba(60,212,147,.15); }
.sync.local i { background: #F2B54A; box-shadow: 0 0 0 3px rgba(242,181,74,.15); }
.sync.loading i { background: #9D93C7; }

.main { min-width: 0; padding-block: 26px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; padding-inline: 12px; }
.top { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.top h1 { font-family: var(--f-display); font-weight: 800; font-stretch: 108%; letter-spacing: -.03em; font-size: clamp(24px, 3vw, 32px); line-height: 1.05; margin: 0; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); }
.top .sp { flex: 1; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; font-size: 22px; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); }
select.sel, input.search { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-width: 0; }
input.search { width: 220px; max-width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 99px; cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 500; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* cards and type */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; flex-wrap: wrap; }
.card > header h2 { margin: 0; font-size: 15px; font-weight: 650; }
.card > header .sp { flex: 1; }
.card > header small { color: var(--muted); }
.card .body { padding: 14px 18px 18px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1280px) { .g-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .g-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.g-2 { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-half { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.g-3 { align-items: start; }
@media (max-width: 1080px) { .g-2, .g-3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .g-half { grid-template-columns: minmax(0, 1fr); } }

.kpi { padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.kpi b { font-family: var(--f-display); font-weight: 750; font-stretch: 110%; letter-spacing: -.02em; font-size: clamp(22px, 2.3vw, 27px); line-height: 1.1; }
.kpi small { color: var(--muted); font-size: 12.5px; }
.kpi.hero { background: radial-gradient(300px 200px at 0% 0%, rgba(126,26,246,.55), rgba(126,26,246,0)), radial-gradient(300px 200px at 100% 100%, rgba(94,6,242,.45), rgba(94,6,242,0)), #0A0620; color: #F1EBFF; border-color: #241A45; }
.kpi.hero .eyebrow, .kpi.hero small { color: #B7AEDD; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* status chips */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.paid, .st.active, .st.won, .st.delivered { background: var(--good-soft); color: var(--good); }
.st.overdue, .st.lost { background: var(--bad-soft); color: var(--bad); }
.st.partial, .st.unpaid, .st.negotiating, .st.paused { background: var(--warn-soft); color: var(--warn); }
.st.brand, .st.pitched { background: var(--accent-soft); color: var(--accent-text); }
.st.plain::before { display: none; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
td .t { font-weight: 600; }
td .s { color: var(--muted); font-size: 12.5px; }
tfoot td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; }
.tbl-min { min-width: 640px; }

/* lists */
.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .grow .t { font-weight: 600; overflow-wrap: anywhere; }
.row .grow .s { color: var(--muted); font-size: 12.5px; }
.days { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.days.soon { background: var(--warn-soft); color: var(--warn); }
.days.late { background: var(--bad-soft); color: var(--bad); }
.bars { display: grid; gap: 11px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13.5px; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { grid-column: 1 / -1; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.empty { text-align: center; padding: 34px 18px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty .serif { font-size: 26px; color: var(--ink); line-height: 1.1; }
.empty p { margin: 0; max-width: 46ch; }

.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .ax.cur { fill: var(--ink); font-weight: 700; }
.chart .ba { fill: var(--bar-a); }
.chart .bb { fill: var(--bar-b); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent-text); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.banner.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.banner p { margin: 0; flex: 1; min-width: 220px; }
.setup { display: grid; gap: 8px; }
.setup .it { display: flex; gap: 10px; align-items: center; }
.setup .it i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-style: normal; font-size: 12px; }
.setup .it.done i { background: var(--good); border-color: var(--good); color: #fff; }
.setup .it.done span { color: var(--muted); text-decoration: line-through; }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; align-content: start; min-height: 140px; }
.col h3 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.col h3 span { color: var(--muted); font-weight: 500; }
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer; display: grid; gap: 5px; text-align: left; width: 100%; }
.deal:hover { border-color: var(--accent); }
.deal .t { font-weight: 650; overflow-wrap: anywhere; }
.deal .m { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }

/* modal */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
#modal .scrim { position: absolute; inset: 0; background: rgba(7,5,14,.55); backdrop-filter: blur(3px); }
.sheet { position: relative; background: var(--surface); border-radius: 16px; width: min(640px, 100%); max-height: calc(100% - 20px); overflow: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); border: 1px solid var(--line); }
.sheet.wide { width: min(980px, 100%); }
.sh { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
.sh h2 { margin: 0; font-family: var(--f-display); font-weight: 750; font-stretch: 106%; letter-spacing: -.02em; font-size: 21px; }
.sh .sub { margin: 4px 0 0; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sh > div { flex: 1; min-width: 0; }
.sf { display: flex; gap: 8px; align-items: center; padding: 14px 20px 18px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.sf .sp { flex: 1; }
.sbody { padding: 8px 20px 18px; display: grid; gap: 16px; }
.grid-form { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 14px; padding: 8px 20px 14px; }
.fld { grid-column: span 6; display: grid; gap: 5px; min-width: 0; }
.fld.half { grid-column: span 3; }
.fld.third { grid-column: span 2; }
.fld label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.fld small { color: var(--muted); font-size: 12px; }
.fld input, .fld select, .fld textarea, .items input, .items select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 11px; min-width: 0; }
.fld input:focus, .fld select:focus, .fld textarea:focus, .items input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); border-color: var(--accent); }
.fld textarea { resize: vertical; }
.fsec { grid-column: 1 / -1; margin: 8px 0 0; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
.check { grid-column: span 6; display: flex; gap: 9px; align-items: center; font-weight: 500; }
.check.half { grid-column: span 3; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
@media (max-width: 560px) { .fld.half, .fld.third, .check.half { grid-column: span 6; } }

.items { padding: 0 20px; display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1.1fr) minmax(0, .7fr) minmax(0, 1.2fr) minmax(0, .9fr) minmax(0, 1.2fr) 32px; gap: 8px; align-items: center; }
.item.head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.item .amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 720px) {
  .item { grid-template-columns: repeat(4, minmax(0, 1fr)) 32px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .item.head { display: none; }
  .item .d { grid-column: 1 / -1; }
  .item .amt { grid-column: span 4; text-align: left; }
}
.totals { margin: 14px 20px 0; margin-left: auto; width: min(360px, calc(100% - 40px)); display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.totals div { display: flex; justify-content: space-between; gap: 12px; }
.totals .grand { font-family: var(--f-display); font-weight: 750; font-size: 19px; border-top: 1px solid var(--line); padding-top: 8px; }
.totals .muted { font-size: 13px; }
.inv-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 20px 14px; }
.paper { margin: 0 20px 20px; background: #E9E5F2; border-radius: 12px; padding: 18px; overflow-x: auto; }
.mini-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.mini-tiles div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.mini-tiles b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.mini-tiles span { color: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 18px; }
.kv div span { display: block; font-size: 12px; color: var(--muted); }
.kv div b { font-weight: 550; overflow-wrap: anywhere; }

.svc-row { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr) 32px; gap: 8px; align-items: center; }
@media (max-width: 560px) { .svc-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 32px; } .svc-row .n { grid-column: 1 / -1; } }

#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
#toast div { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow); max-width: min(92vw, 520px); }
#toast div.bad { background: var(--bad); color: #fff; }

/* phones and tablets: the sidebar becomes a top bar with a scrolling tab strip */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 20; flex-direction: column; gap: 10px; padding-block: 12px 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--side-line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--side); }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; margin-inline: -4px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { padding: 7px 11px; white-space: nowrap; }
  .nav button svg { display: none; }
  .side-foot { display: none; }
  .brand small { display: inline; margin: 0 0 0 8px; }
  .wrap { padding-inline: 0; }
  .main { padding-top: 18px; }
  .sheet { border-radius: 16px 16px 0 0; max-height: 100%; }
  #modal { padding: 0; place-items: end stretch; }

async function initStore() {
  let db = null;
  try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { loadLocal(); return; }
  DB = db; S.mode = 'db';
  const seen = new Set(), confirmed = new Set(), keys = [...COLS, 'config'];
  const timer = setTimeout(() => { if (confirmed.size < keys.length) { S.slow = true; render(); } }, 10000);
  const got = (k, snap) => {
    seen.add(k); if (!snap.metadata.fromCache) confirmed.add(k);
    if (confirmed.size === keys.length) { clearTimeout(timer); S.slow = false; }
    if (seen.size === keys.length) S.loaded = true;
    schedule();
  };
  const fail = e => { clearTimeout(timer); S.slow = false; S.loaded = true; if (e && e.code === 'revoked') { S.mode = 'revoked'; } else dbErr(e); schedule(); };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id })); got(c, snap); }, fail));
  db.doc('config/business').onSnapshot(snap => { S.config = { ...DEFAULT_CONFIG, ...(snap.exists ? snap.data() : {}) }; S.configSaved = snap.exists; got('config', snap); }, fail);
}
const clean = o => JSON.parse(JSON.stringify(o));
async function saveDoc(col, obj) {

  if (DB) { try { await DB.collection(col).doc(id).set(body); } catch (e) { dbErr(e); throw e; } }
  else { const arr = S[col]; const i = arr.findIndex(x => x.id === id); const row = { ...body, id }; if (i >= 0) arr[i] = row; else arr.push(row); persistLocal(); schedule(); }
  return id;
}
async function removeDoc(col, id) {

}

function barChart(months, a, b) {

  months.forEach((m, i) => {

const barList = (obj, nameOf = k => k, limit = 6) => {

  }
  switch (a) {
    case 'nav': if (S.view === 'settings' && S.settingsDirty && el.dataset.view !== 'settings') { S.settingsDirty = false; } S.view = el.dataset.view; S.f.q = ''; render(); window.scrollTo(0, 0); break;
    case 'close': closeModal(); break;
    case 'modal-del': if (MODAL_DEL) { const fn = MODAL_DEL; try { await fn(); closeModal(); } catch (e) { /* toast shown */ } } break;
    case 'filter': S.f[el.dataset.key] = el.dataset.val; render(); break;
    case 'new-client': clientForm({ type: 'client', status: 'active', country: 'India', currency: 'INR', tdsRate: 0 }); break;
    case 'edit-client': clientForm(client(id)); break;
    case 'view-client': clientView(id); break;
    case 'new-invoice': {
      if (!S.clients.length) { toast('Add a client first, then create the invoice.'); clientForm({ type: 'client', status: 'active', country: 'India', currency: 'INR', tdsRate: 0 }); break; }
      const cl = client(el.dataset.client);
      invoiceEditor(cl ? { clientId: cl.id, currency: cl.currency || 'INR', fx: fxRate(cl.currency), tdsRate: num(cl.tdsRate), taxMode: autoTaxMode(cl), kind: cl.type === 'brand' ? 'brand' : 'project' } : {}); break; }
    case 'bill-retainer': {
      const cl = client(id); if (!cl) break; const svc = (cl.services || 'Monthly retainer').split(',')[0].trim();
      const known = (S.config.services || []).find(s => s.name.toLowerCase() === svc.toLowerCase());
      invoiceEditor({ clientId: cl.id, kind: 'retainer', period: THIS_MONTH, currency: cl.currency || 'INR', fx: fxRate(cl.currency), tdsRate: num(cl.tdsRate), taxMode: autoTaxMode(cl),
        items: [{ desc: `${svc} retainer · ${fmtMonth(THIS_MONTH)}`, sac: known ? known.sac : '998361', qty: 1, rate: num(cl.retainer), gst: S.config.gstRegistered ? (num(S.config.defaultGst) || 18) : 0 }] }); break; }
    case 'view-invoice': invoiceView(id); break;
    case 'edit-invoice': { const inv = S.invoices.find(i => i.id === id); if (inv) invoiceEditor(inv); break; }
    case 'inv-sent': { const inv = S.invoices.find(i => i.id === id); if (inv) { await saveDoc('invoices', { ...inv, status: 'sent' }); toast('Marked as sent'); setTimeout(() => invoiceView(id), 60); } break; }
    case 'inv-settle': { const inv = S.invoices.find(i => i.id === id); if (inv) { await saveDoc('invoices', { ...inv, settled: true }); toast('Marked as fully paid'); setTimeout(() => invoiceView(id), 60); } break; }
    case 'inv-cancel': { const inv = S.invoices.find(i => i.id === id); if (inv) { await saveDoc('invoices', { ...inv, status: 'cancelled' }); toast('Invoice cancelled'); setTimeout(() => invoiceView(id), 60); } break; }
    case 'inv-dup': { const inv = S.invoices.find(i => i.id === id); if (inv) { const { id: _i, number, seq, fy, createdAt, updatedAt, settled, sample, ...rest } = inv; closeModal(); invoiceEditor({ ...rest, date: TODAY, dueDate: '', status: 'draft', period: rest.kind === 'retainer' ? THIS_MONTH : '' }); } break; }
    case 'inv-download': { const inv = S.invoices.find(i => i.id === id); if (inv) saveFile(`${inv.number.replace(/\//g, '-')}.html`, `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(inv.number)} · ${esc(S.config.bizName)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600;700&display=swap"><style>body{margin:0;background:#ECE9F3;padding:24px}${INV_CSS}@media print{body{background:#fff;padding:0}.inv{border-radius:0;max-width:none}}@page{size:A4;margin:12mm}</style></head><body>${invoiceDoc(inv)}</body></html>`); break; }
    case 'inv-copy': { const inv = S.invoices.find(i => i.id === id); if (!inv) break; const t = reminderText(inv);
      try { await navigator.clipboard.writeText(t); toast('Reminder copied. Paste it in WhatsApp or email.'); } catch (e) { openModal(`<header class="sh"><div><h2>Payment reminder</h2><p class="sub">Select and copy this text</p></div><button class="icon-btn" data-act="close" aria-label="Close">×</button></header><div class="sbody"><textarea style="width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)" readonly>${esc(t)}</textarea></div>`); setTimeout(() => { const ta = $('#modal textarea'); ta && ta.select(); }, 50); } break; }
    case 'new-payment': paymentForm(el.dataset.client ? { clientId: el.dataset.client, source: client(el.dataset.client)?.type === 'brand' ? 'brand' : 'invoice' } : {}, el.dataset.inv); break;
    case 'edit-payment': { const p = S.payments.find(x => x.id === id); if (p) paymentForm(p); break; }
    case 'new-expense': expenseForm({}); break;
    case 'edit-expense': { const e = S.expenses.find(x => x.id === id); if (e) expenseForm(e); break; }
    case 'dup-expense': { const e = S.expenses.find(x => x.id === id); if (e) expenseForm(e, true); break; }
    case 'new-deal': dealForm({ stage: 'lead', kind: 'brand', currency: 'INR' }); break;
    case 'edit-deal': { const d = S.deals.find(x => x.id === id); if (d) dealForm(d); break; }
    case 'deal-invoice': { const d = S.deals.find(x => x.id === id); const cl = d && client(d.clientId); if (!cl) break; closeModal();
      invoiceEditor({ clientId: cl.id, kind: d.kind === 'client' ? 'project' : 'brand', currency: d.currency || cl.currency || 'INR', fx: fxRate(d.currency || cl.currency), tdsRate: num(cl.tdsRate), taxMode: autoTaxMode(cl),
        items: [{ desc: d.title, sac: '998361', qty: 1, rate: num(d.value), gst: S.config.gstRegistered ? (num(S.config.defaultGst) || 18) : 0 }] }); break; }
    case 'clear-samples': { let n = 0; try { for (const c of COLS) for (const row of S[c].filter(x => x.sample)) { await removeDoc(c, row.id); n++; } toast(`Cleared ${n} example records`); } catch (e) { /* toast shown */ } break; }
    case 'csv': exportCSV(el.dataset.kind); break;
    case 'backup': saveFile(`nxtlvl-ledger-backup-${TODAY}.json`, JSON.stringify({ app: 'nxtlvl-ledger', version: 1, exportedAt: new Date().toISOString(), config: S.config, ...Object.fromEntries(COLS.map(c => [c, S[c]])) }, null, 2)); break;
    case 'restore': $('#restore-file').value = ''; $('#restore-file').click(); break;
    case 'do-restore': doRestore(); break;
    case 'svc-add': { S.settingsDirty = true; const box = $('#svc'); const i = box.children.length; box.insertAdjacentHTML('beforeend', `<div class="svc-row" data-svc="${i}"><input class="n" data-k="name" placeholder="Service" aria-label="Service name"><input data-k="sac" value="998361" placeholder="SAC" aria-label="SAC code"><input data-k="rate" type="number" step="any" placeholder="Rate ₹" aria-label="Default rate"><select data-k="gst" aria-label="GST">${opt([0, 5, 12, 18, 28], 18)}</select><button type="button" class="icon-btn" data-act="svc-del" aria-label="Remove service">×</button></div>`); box.lastElementChild.querySelector('input').focus(); break; }
    case 'svc-del': S.settingsDirty = true; el.closest('.svc-row').remove(); break;
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.closest('#invform') && ['add-item', 'del-item'].includes(el.dataset.act)) return;
  if (el.tagName === 'A') return;
  e.preventDefault(); act(el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.f.q = e.target.value; render(); }
  if (e.target.closest('#settings')) S.settingsDirty = true;
});
document.addEventListener('change', e => {
  if (e.target.id === 'fy-sel') { S.fy = Number(e.target.value); render(); }
  if (e.target.id === 'cat-sel') { S.f.expCat = e.target.value; render(); }
  if (e.target.closest('#settings')) S.settingsDirty = true;
  if (e.target.id === 'restore-file') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || d.app !== 'nxtlvl-ledger') throw new Error('x');
      RESTORE = d; const n = COLS.reduce((s, c) => s + (Array.isArray(d[c]) ? d[c].length : 0), 0);
      openModal(`<header class="sh"><div><h2>Restore backup?</h2><p class="sub">From ${esc(fmtDate((d.exportedAt || '').slice(0, 10)))} · ${n} records</p></div><button class="icon-btn" data-act="close" aria-label="Close">×</button></header><div class="sbody"><p style="margin:0">Records in the backup are added back, and any with the same ID are replaced. Records you added since the backup stay as they are.</p></div><footer class="sf"><span class="sp"></span><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="do-restore">Restore ${n} records</button></footer>`);
    } catch (er) { toast('That file isn\'t a Nxtlvl Ledger backup.', 'bad'); } };
    rd.readAsText(f);
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'settings') return;
  e.preventDefault();
  const form = e.target, fields = SETTINGS_FIELDS(), v = readForm(form, fields);
  const err = validate(fields, v); if (err) { toast(err, 'bad'); return; }
  if (!v.bizName) { toast('Brand name is required.', 'bad'); return; }
  if (v.gstRegistered && !v.gstin) { toast('Add your GSTIN, or untick GST registration.', 'bad'); return; }
  if (v.gstin && v.state && stateByCode(v.gstin.slice(0, 2)) && stateByCode(v.gstin.slice(0, 2)) !== v.state) { toast(`Your GSTIN is registered in ${stateByCode(v.gstin.slice(0, 2))}. Pick that as your state.`, 'bad'); return; }
  const services = [...form.querySelectorAll('.svc-row')].map(r => ({ name: r.querySelector('[data-k=name]').value.trim(), sac: r.querySelector('[data-k=sac]').value.trim(), rate: r.querySelector('[data-k=rate]').value === '' ? '' : num(r.querySelector('[data-k=rate]').value), gst: num(r.querySelector('[data-k=gst]').value) })).filter(s => s.name);
  const fx = {}; form.querySelectorAll('[data-fx]').forEach(i => { if (i.value !== '') fx[i.dataset.fx] = num(i.value); });
  v.defaultGst = num(v.defaultGst); v.terms = num(v.terms) || 7; v.taxReservePct = num(v.taxReservePct);
  try { await saveConfig({ ...S.config, ...v, services, fx }); S.settingsDirty = false; toast('Settings saved'); render(); } catch (er) { /* toast shown */ }
});

/* ---------- boot ---------- */
$('#brand').innerHTML = `${starSVG(34, false)}<div><div class="wm">nxtlvl<span>social</span></div><small>Ledger</small></div>`;
const style = document.createElement('style'); style.textContent = INV_CSS; document.head.appendChild(style);
render();
initStore();
})();
</script>
