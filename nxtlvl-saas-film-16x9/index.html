<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #0B0618; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; }
      #ground { position: absolute; inset: 0; background: var(--ground); overflow: hidden; }
      .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
      #blob-a { left: -260px; top: -320px; width: 1100px; height: 900px; background: rgba(126, 26, 246, .42); }
      #blob-b { right: -300px; bottom: -380px; width: 1100px; height: 950px; background: rgba(94, 6, 242, .34); }
      #blob-c { left: 760px; top: 640px; width: 700px; height: 520px; background: rgba(255, 79, 163, .12); }
      #texture { position: absolute; inset: 0; opacity: .55; background-image: radial-gradient(rgba(216, 187, 255, .08) 1.4px, transparent 1.4px); background-size: 34px 34px; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 60%, rgba(0, 0, 0, .45)); pointer-events: none; z-index: 20; }
      .flash { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
      .flash i { position: absolute; inset: 0; background: radial-gradient(60% 70% at 50% 50%, rgba(216, 187, 255, .5), rgba(125, 24, 252, .22) 45%, transparent 75%); opacity: 0; }
      .star { position: absolute; inset: 0; z-index: 31; pointer-events: none; overflow: hidden; }
      .star i { position: absolute; left: 0; top: 0; width: 520px; height: 6px; border-radius: 6px; background: linear-gradient(90deg, rgba(169, 92, 255, 0), rgba(216, 187, 255, .8) 70%, #fff); box-shadow: 0 0 20px rgba(216, 187, 255, .8); transform-origin: 100% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1920" data-height="1080" data-motion-blur="on">
      <div id="ground" class="clip" data-start="0" data-duration="22" data-track-index="0"><div id="blob-a" class="blob"></div><div id="blob-b" class="blob"></div><div id="blob-c" class="blob"></div></div>
      <div id="texture" class="clip" data-start="0" data-duration="22" data-track-index="1" data-layout-ignore></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="agents" data-composition-id="agents" data-composition-src="compositions/agents.html" data-start="4.6" data-duration="5.8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="automation" data-composition-id="automation" data-composition-src="compositions/automation.html" data-start="10.4" data-duration="5.0" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="15.4" data-duration="3.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="18.6" data-duration="3.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fx-flash0" class="clip flash" data-start="4.45" data-duration="0.5" data-track-index="3" data-layout-ignore><i></i></div>
      <div id="fx-flash1" class="clip flash" data-start="10.25" data-duration="0.5" data-track-index="3" data-layout-ignore><i></i></div>
      <div id="fx-flash2" class="clip flash" data-start="15.25" data-duration="0.5" data-track-index="3" data-layout-ignore><i></i></div>
      <div id="fx-flash3" class="clip flash" data-start="18.45" data-duration="0.5" data-track-index="3" data-layout-ignore><i></i></div>
      <div id="fx-star0" class="clip star" data-start="4.3" data-duration="0.7" data-track-index="4" data-layout-ignore><i></i></div>
      <div id="fx-star1" class="clip star" data-start="15.1" data-duration="0.7" data-track-index="4" data-layout-ignore><i></i></div>
      <div id="fx-star2" class="clip star" data-start="18.3" data-duration="0.7" data-track-index="4" data-layout-ignore><i></i></div>
      <div id="vignette" class="clip" data-start="0" data-duration="22" data-track-index="5" data-layout-ignore></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // the light behind everything drifts slowly (a background stage, 22 s, loops back to its start)
      tl.fromTo("#blob-a", { x: 0, y: 0 }, { x: 260, y: 140, duration: 11.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#blob-b", { x: 0, y: 0 }, { x: -240, y: -120, duration: 11.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#blob-c", { x: 0, scale: 1 }, { x: -380, scale: 1.3, duration: 11.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      // a violet light flash on every scene seam
      tl.fromTo("#fx-flash0 i", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 4.45);tl.fromTo("#fx-flash1 i", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 10.25);tl.fromTo("#fx-flash2 i", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 15.25);tl.fromTo("#fx-flash3 i", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 18.45);
      // shooting stars (the logo's rocket) streak across at the big hand-offs
      tl.fromTo("#fx-star0 i", { x: -600, y: 900, rotation: -28, opacity: 1 }, { x: 2200, y: 60, rotation: -28, opacity: 1, duration: 0.6, ease: "power2.in" }, 4.3);tl.fromTo("#fx-star1 i", { x: -600, y: 780, rotation: -28, opacity: 1 }, { x: 2200, y: 120, rotation: -28, opacity: 1, duration: 0.6, ease: "power2.in" }, 15.1);tl.fromTo("#fx-star2 i", { x: -600, y: 660, rotation: -28, opacity: 1 }, { x: 2200, y: 180, rotation: -28, opacity: 1, duration: 0.6, ease: "power2.in" }, 18.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
