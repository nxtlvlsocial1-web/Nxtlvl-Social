  policeMeshes.forEach((m, k) => { const L = m.userData.lights; L[0].visible = flash === 0; L[1].visible = flash === 1; policePools[k][0].material.opacity = flash === 0 ? 0.75 : 0.1; policePools[k][1].material.opacity = flash === 1 ? 0.75 : 0.1; });
  // camera
  const sx = state.shake * Math.sin(t * 61) * 0.8, sy = state.shake * Math.sin(t * 47) * 0.6;
  camera.position.set(lerp(cm.px, cm.x, A) + sx, lerp(cm.py, cm.y, A) + sy, lerp(cm.pz, cm.z, A));
  camera.lookAt(lerp(cm.ptx, cm.tx, A), lerp(cm.pty, cm.ty, A), lerp(cm.ptz, cm.tz, A));
  const chase = mode !== 'title' && view.mode === 'chase';
  camera.fov = (chase ? fovFor(camera.aspect, tune.chase_fov, tune.chase_fov_across) : fovFor(camera.aspect, tune.cam_fov)) + (mode !== 'title' ? tune.cam_speed_fov * clamp(sp / tune.car_max_speed, 0, 1) + tune.jump_fov_kick * state.fovKick : 0);
  camera.updateProjectionMatrix();
  drawRain(cm.tx, cm.ty, cm.tz, t, mode === 'play' ? clamp(sp / tune.car_max_speed, 0, 1) : 0);
  drawParticles(smoke, 0.6); drawParticles(sparks, 1); drawRings();
  renderer.render(scene3, camera);
}
function dim() { ctx.fillStyle = 'rgba(8,3,18,0.55)'; ctx.fillRect(0, 0, W, H); }
function drawTitle() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(8,3,18,0.75)'); g.addColorStop(0.6, 'rgba(8,3,18,0.25)'); g.addColorStop(1, 'rgba(8,3,18,0.8)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const big = Math.min(120, W / 7.2), y0 = H * 0.27;
  text('NEON DRIFT', W / 2, y0, big, '#ff2bd6', 'center', { glow: '#ff2bd6', stroke: '#1a0526' });
  text('DISTRICT', W / 2, y0 + big * 0.95, big * 0.82, '#22e8ff', 'center', { glow: '#22e8ff', stroke: '#06121f' });
  text('Drift the rain-soaked city at night', W / 2, y0 + big * 1.75, 30, '#ffd9f4', 'center', { italic: false, weight: 700 });
  CONTROLS.forEach((c, i) => text(c, W / 2, H * 0.6 + i * 40, 26, '#e8e4ff', 'center', { italic: false, weight: 600 }));
  if (Math.floor(state.t * 2) % 2 === 0) text('PRESS ENTER TO DRIVE', W / 2, H - 70, 38, '#ffd400', 'center', { glow: '#ff6a1a', stroke: '#1a0a00' });
}
function drawFigureLabels() {
  ctx.fillStyle = 'rgba(8,3,18,0.6)'; ctx.fillRect(0, 0, W, 70);
  text('The cars of Neon Drift District', W / 2, 36, 32, '#fff', 'center');
  const v = new THREE.Vector3();
  FIGS.forEach((f, k) => {
    v.set(FIG_X + (k - 1.5) * 7, -0.2, 3.4).project(camera);
    const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
    text(f[2], x, y + 26, 22, '#ffd400', 'center', { italic: false, weight: 800, stroke: '#000' });
  });
}
function speedoR() { return Math.min(W, H) * (H > W ? 0.21 : 0.17); } // bigger on a tall screen
function drawSpeedo() {
  const c = state.car, sp = Math.hypot(c.vx, c.vz), kmh = Math.round(sp * 4);
  const R = speedoR(), cx = W / 2, cy = H - R - 34;
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25, k = clamp(sp / (tune.car_max_speed * 1.04), 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(10,4,24,0.72)'; ctx.beginPath(); ctx.arc(cx, cy, R * 1.12, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = R * 0.13; ctx.beginPath(); ctx.arc(cx, cy, R * 0.92, a0, a1); ctx.stroke();
  const gr = ctx.createLinearGradient(cx - R, cy, cx + R, cy); gr.addColorStop(0, '#22e8ff'); gr.addColorStop(0.6, '#ff2bd6'); gr.addColorStop(1, '#ff3355');
  ctx.strokeStyle = gr; ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(cx, cy, R * 0.92, a0, a0 + (a1 - a0) * k + 0.001); ctx.stroke(); ctx.shadowBlur = 0;
  for (let v = 0; v <= 200; v += 20) { // ticks every 20 km/h
    const a = a0 + (a1 - a0) * v / 208, r1 = R * 0.74, r2 = R * (v % 40 ? 0.79 : 0.82);
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = v % 40 ? 2 : 4; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
  }
  const na = a0 + (a1 - a0) * k; // the needle
  ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 5; ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(cx + Math.cos(na) * R * 0.3, cy + Math.sin(na) * R * 0.3); ctx.lineTo(cx + Math.cos(na) * R * 0.86, cy + Math.sin(na) * R * 0.86); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.restore();
  text(String(kmh), cx, cy - R * 0.02, R * 0.62, '#ffffff', 'center', { glow: '#22e8ff' });
  text('KM/H', cx, cy + R * 0.42, Math.max(18, R * 0.17), '#22e8ff', 'center', { italic: false, weight: 800 });
}
function drawCombo() {
  if (state.combo <= 0) return;
  const p = state.popT, sc = 1 + p * p * 0.9, y = H * (H > W ? 0.2 : 0.24), size = (H > W ? 118 : Math.min(96, W / 7.5)) * sc;
  const live = state.inDrift, fade = live ? 1 : clamp(state.comboTimer / tune.combo_window, 0.35, 1);
  ctx.save(); ctx.globalAlpha = fade;
  ctx.translate(W / 2, y); ctx.rotate(-0.06);
  ctx.font = `italic 900 ${size * 0.78}px ${FONT}`; const w1 = ctx.measureText('DRIFT ').width;
  ctx.font = `italic 900 ${size * 1.05}px ${FONT}`; const w2 = ctx.measureText('x' + state.combo).width;
  const fit = Math.min(1, (W - 40) / (w1 + w2)); ctx.scale(fit, fit);
  text('DRIFT', -(w1 + w2) / 2, 0, size * 0.78, '#ffffff', 'left', { glow: '#ff2bd6', stroke: '#2a0638' });
  text('x' + state.combo, -(w1 + w2) / 2 + w1, 0, size * 1.05, state.combo >= 3 ? '#ffd400' : '#ff2bd6', 'left', { glow: '#ff2bd6', stroke: '#2a0638' });
  ctx.restore();
  ctx.save(); ctx.globalAlpha = fade;
  text('+' + Math.round(state.driftPts * state.combo).toLocaleString('en-US'), W / 2, y + size * 0.82, Math.max(30, size * 0.4), '#7dff4a', 'center', { stroke: '#062010' });
  // the chain's fuse: time left to start the next drift
  if (!live) { const bw = Math.min(360, W * 0.5), k = clamp(state.comboTimer / tune.combo_window, 0, 1); ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(W / 2 - bw / 2, y + size * 1.2, bw, 8); ctx.fillStyle = '#ff2bd6'; ctx.fillRect(W / 2 - bw / 2, y + size * 1.2, bw * k, 8); }
  ctx.restore();
}
function drawArrowTo(tx, tz, x, y, s, col) { // points from the car to a place in the city, as the camera faces
  const c = state.car, a = Math.atan2(tx - c.x, -(tz - c.z)) - (view.mode === 'chase' ? state.cam.yaw || 0 : 0);
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.strokeStyle = '#140620'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, s * 0.55); ctx.lineTo(0, s * 0.2); ctx.lineTo(-s * 0.7, s * 0.55); ctx.closePath(); ctx.stroke(); ctx.fill();
  ctx.restore();
}
function drawTitleCard() { // MY OPEN WORLD - BUILT BY CLAUDE: slams in at the start, then clears for the drive
  const t = state.cardT, T = tune.card_time; if (t >= T) return;
  const inK = clamp(t / 0.35, 0, 1), outK = clamp((t - (T - 0.45)) / 0.45, 0, 1), a = inK * (1 - outK);
  const e = 1 - Math.pow(1 - inK, 3), sc = 1.5 - 0.5 * e, cy = H * 0.36, bandH = Math.min(W, H) * 0.5;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,3,20,0.72)'; ctx.fillRect(0, cy - bandH / 2, W, bandH);
  ctx.fillStyle = '#ff2bd6'; ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 20; ctx.fillRect(0, cy - bandH / 2, W * e, 6); ctx.fillStyle = '#22e8ff'; ctx.shadowColor = '#22e8ff'; ctx.fillRect(W * (1 - e), cy + bandH / 2 - 6, W, 6); ctx.shadowBlur = 0;
  ctx.translate(W / 2 - outK * W * 0.6, cy); ctx.scale(sc, sc);
  const l1 = 'MY OPEN WORLD', l2 = '- BUILT BY CLAUDE';
  ctx.font = `italic 900 100px ${FONT}`; const s1 = Math.min(118, 100 * (W * 0.9) / ctx.measureText(l1).width);
  ctx.font = `italic 900 100px ${FONT}`; const s2 = Math.min(s1 * 0.62, 100 * (W * 0.86) / ctx.measureText(l2).width);
  text(l1, 0, -s1 * 0.36, s1, '#ffffff', 'center', { glow: '#ff2bd6', stroke: '#2a0638' });
  text(l2, 0, s1 * 0.5, s2, '#22e8ff', 'center', { glow: '#22e8ff', stroke: '#04121c' });
  ctx.restore();
}
function drawHUD() {
  const pad = 26;
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,240,255,${state.flash * 0.3})`; ctx.fillRect(0, 0, W, H); }
  if (!view.hud) { drawSpeedo(); return; } // H: only the speedometer stays
  drawTitleCard();
  text('SCORE', pad, 34, 22, '#22e8ff', 'left', { italic: false, weight: 800 });
  text(state.score.toLocaleString('en-US'), pad, 70, 44, '#fff', 'left', { stroke: '#120620' });
  if (state.bestCombo > 1) text('BEST CHAIN x' + state.bestCombo, pad, 108, 22, '#ff2bd6', 'left', { italic: false, weight: 800 });
  const ch = state.challenge;
  if (ch) {
    const left = Math.max(0, tune.challenge_time - ch.t);
    text('ROOFTOP RUN', W - pad, 34, 22, '#ffd400', 'right', { italic: false, weight: 800 });
    text(left.toFixed(1), W - pad, 72, 50, left < 10 ? '#ff3355' : '#fff', 'right', { stroke: '#120620' });
    if (ch.phase === 'run') {
      const c = state.car, target = c.y > 8 ? { x: 280, z: 92 } : { x: 280, z: 150 };
      drawArrowTo(target.x, target.z, W - pad - 30, 134, 22, '#ffd400');
      text(Math.round(Math.hypot(target.x - c.x, target.z - c.z)) + ' m', W - pad - 66, 134, 24, '#ffd400', 'right', { italic: false, weight: 800 });
    }
  } else {
    text('ENTER', W - pad, 34, 22, '#ffd400', 'right', { italic: false, weight: 800 });
    text('ROOFTOP RUN', W - pad, 62, 22, '#fff', 'right', { italic: false, weight: 800 });
    drawArrowTo(280, 120, W - pad - 20, 104, 18, '#22e8ff');
  }
  drawCombo();
  let my = H * 0.42;
  for (const m of state.msgs) { const k = m.life / m.max; ctx.save(); ctx.globalAlpha = Math.min(1, k * 3); text(m.s, W / 2, my - (1 - k) * 30, m.size * (1 + (1 - Math.min(1, (1 - k) * 6)) * 0.4), m.color, 'center', { stroke: '#120620', glow: m.color }); ctx.restore(); my += m.size * 1.15; }
  if (state.hintT > 0 && state.cardT > tune.card_time) { const R = speedoR(); ctx.save(); ctx.globalAlpha = Math.min(1, state.hintT); text('HOLD UP TO DRIVE   HOLD SPACE TO DRIFT', W / 2, H - R * 2.12 - 70, Math.min(30, W / 22), '#fff', 'center', { stroke: '#120620' }); ctx.restore(); }
  drawSpeedo();
  if (muted) text('MUTED', pad, H - 30, 20, '#aaa', 'left', { italic: false, weight: 700 });
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

fit();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
