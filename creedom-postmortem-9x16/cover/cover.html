<!doctype html>

<html><head><meta charset="utf-8"><style>
@font-face { font-family: Unb; font-weight: 900; src: url("../assets/fonts/unbounded-latin-900-normal.woff2"); }
@font-face { font-family: Sat; font-weight: 500; src: url("../assets/fonts/fontshare/Satoshi-Medium.woff2"); }

* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; overflow: hidden; }

.bar { position: absolute; left: 90px; right: 90px; top: 330px; display: flex; align-items: center; gap: 18px; }
.bar img { height: 50px; }
.bar span { font-family: Mono; font-size: 24px; letter-spacing: .2em; color: rgba(16,19,28,.7); }
.bar b { margin-left: auto; font-weight: 700; font-size: 34px; background: #fff; padding: 12px 24px; border-radius: 999px; border: 2px solid #e8307d; box-shadow: 0 12px 30px rgba(40,50,90,.14); }

h1 { position: absolute; left: 88px; right: 70px; top: 440px; font-weight: 900; font-size: 112px; line-height: .98; letter-spacing: -.04em; }

.card { position: absolute; left: 70px; top: 900px; width: 900px; border-radius: 40px; padding: 34px 38px 40px; background: rgba(255,255,255,.94);

.ch { display: flex; align-items: center; justify-content: space-between; }
.ch img { height: 60px; }
.ch span { font-family: Mono; font-size: 24px; letter-spacing: .18em; color: rgba(16,19,28,.6); }
.chart { position: relative; margin-top: 26px; height: 330px; border-radius: 26px; background: #f4f6fb; padding: 22px; }
.chart svg { width: 100%; height: 100%; overflow: visible; }
.dot { position: absolute; left: 31%; top: 33%; width: 34px; height: 34px; border-radius: 50%; background: #d22b22; box-shadow: 0 0 0 14px rgba(226,57,47,.16); }
.lab { position: absolute; left: 37%; top: 9%; background: #10131c; color: #fff; font-weight: 700; font-size: 38px; padding: 10px 22px; border-radius: 14px; }
.stat { position: absolute; left: 90px; top: 1440px; display: flex; gap: 18px; }
.stat div { background: #fff; border-radius: 22px; padding: 16px 26px; box-shadow: 0 16px 40px rgba(40,50,90,.12); font-weight: 700; font-size: 34px; }
.stat b { font-family: Unb; font-weight: 900; color: #d22b22; letter-spacing: -.04em; margin-right: 8px; }
.cree { position: absolute; right: 50px; top: 1250px; width: 330px; filter: drop-shadow(0 20px 30px rgba(40,50,90,.22)); }
